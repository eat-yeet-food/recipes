ingredients:
  - title: Levain
    items:
      - 20g starter
      - 20g bread flour
      - 20g whole wheat flour
      - 40g water
  - title: Bread
    items:
      - '330g [strong bread flour](https://www.walmart.com/ip/King-Arthur-Unbleached-Flour-5-lbs/10535108?wmlspartner=wlpa&selectedSellerId=0&wmlspartner=wlpa&cn=FY26-ENTP-PMAX_CVP_cnv_dps_dsn_dis_ad_entp_e_n&gclsrc=aw.ds&adid=2222222229710535108_0000000000_22488309517&wl0=&wl1=x&wl2=c&wl3=&wl4=&wl5=9009731&wl6=&wl7=&wl8=&wl9=pla&wl10=8175035&wl11=online&wl12=10535108&veh=sem&gad_source=1&gad_campaignid=22488321244&gbraid=0AAAAADmfBIpnwbCRCx-Lh8QmClJX7tCPp&gclid=Cj0KCQjw8KrFBhDUARIsAMvIApZAbILLGSMWrz1ABKhWgrRQmpk_e3aTcFm7hEG-wrTvuiJNb6qf1jAaAhBoEALw_wcB)'
      - '70g [whole wheat flour](https://www.target.com/p/bob-39-s-red-mill-organic-whole-wheat-flour-5lbs/-/A-92889638?sid=&TCID=PDS-22806998596&gclsrc=aw.ds&gad_source=1&gad_campaignid=22803279746&gbraid=0AAAAAD-5dfZBxwL-BLt-ymR8_PLhoa3xI&gclid=Cj0KCQjw8KrFBhDUARIsAMvIApZsBV2zeEfCYO1LqrfoeLFww5kNUKvm8kiJL8-RcQ-4-qacCOa4VkEaAjIPEALw_wcB)'
      - '290g + 15g + 15g water, room temperature (divided)'
      - 80g peak levain
      - '9g [salt](https://www.amazon.com/Diamond-Crystal-Baking-Kosher-8-5oz/dp/B0CHVLXM7R/ref=sr_1_6_pp?dib=eyJ2IjoiMSJ9.jc2WdEi1A5_iFEyZqDRiS5lOXcnLhPFL6wkhy3hAZVLJcTsU2sHs_J-AWzySX_HAuS2qp4iHJ-HErpaB5ETMOlhDG6toZVxC0T5EeFgS7A1mBDPeKeJgLsWIDa8ZfTRmxJyQT909kOGia7EGIudysRhLVA2FL_3NBEW9YliE6P81pHovQbK93WdQ1HuPUMvj0sRSNb23UHdpTZC4TiSrmWwVD3IkMIz7hH06xvhXw6u7dU1lvPT2aGsObUyIBb3MSo3QerQ3qLpcmKi8lcO2Y99_pYRXg0uLprCqGVnm_78.n6BzmLiS5vxRRSy05TXIxdTI2LHInGK3rND8pkGUcVg&dib_tag=se&keywords=baking+salt&qid=1756039494&sr=8-6)'
steps:
  - title: Levain
    items:
      - Mix starter with water and flour
      - Cover and rest at 78°F for 5h
  - title: Autolyse
    items:
      - Mix flour and the first portion of water (290g) until shaggy
      - Pinch in the second portion of water (15g) until dry bits and chunks are gone
      - Cover and rest at 78°F for 3h. Add levain to autolyse dough and mix until just combined (fermentalyse) + cover and rest at 78°F for 20m
  - title: Bulk Fermentation
    items:
      - Gently pinch in salt + remainder of water (15g). Rubaud and stretch in the bowl for 8m + cover and rest at 78°F for 20m (30m elapsed in bulk)
      - 'Strong fold + cover and rest at 78°F for 30m (1:00h elapsed in bulk)'
      - 'Strong fold + cover and rest at 78°F for 30m (1:30h elapsed in bulk)'
      - 'Coil fold + cover and rest at 78°F for 30m (2:00h elapsed in bulk)'
      - 'Coil fold + cover and rest at 78°F for approximately 2:00h (2:30h elapsed in bulk)'
      - 'End of bulk when risen approximately 50% in volume (approximately 4:30h elapsed in bulk)'
  - title: Shape
    items:
      - Preshape and rest at 70°F for 30m
      - Shape and place in banneton and rest at 70°F for 30m
      - Place in 38°F refrigerator for 12-18h
  - title: Bake
    items:
      - Preheat oven at 550°F for 30m
      - Score loaf at 45° down center and bake in a covered dutch oven at 500°F for 6m
      - 'Reinforcement expansion score, cover and bake for 14m'
      - Bake uncovered at 500°F for 25m
      - Transfer to cooling rack and cool for 2h before cutting
notes:
  - The autolyse process allows flour to fully hydrate and develops gluten naturally
  - Bulk fermentation timing can vary based on temperature and starter activity
  - Cold retarding in the refrigerator develops flavor and makes shaping easier
  - Proper scoring allows controlled expansion during baking
  - High initial heat creates steam for crust development
tips:
  - Keep your starter healthy and active for best results
  - Temperature control is crucial throughout the process
  - Don't rush the fermentation process - time develops flavor
  - Use a kitchen scale for accurate measurements
  - 'Watch [stretch and fold technique](https://www.theperfectloaf.com/how-to-stretch-and-fold-sourdough-bread-dough/) for proper bulk fermentation'
  - 'Master [preshaping technique](https://www.theperfectloaf.com/guides/how-to-preshape-bread-dough/) for better final shape'
  - 'Learn [batard shaping technique](https://www.theperfectloaf.com/guides/shaping-a-batard/) for oval-shaped loaves'
  - 'Learn proper [scoring techniques](https://www.theperfectloaf.com/guides/the-ultimate-guide-to-baking-bread-dough/) for optimal oven spring'
  - 'Read about [percent rise](https://thesourdoughjourney.com/the-mystery-of-percentage-rise-in-bulk-fermentation/) to help understand when bulk fermentation is complete'
