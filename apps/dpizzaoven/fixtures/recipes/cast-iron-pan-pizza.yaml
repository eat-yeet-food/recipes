slug: cast-iron-pan-pizza
title: 'Cast Iron Pan Pizza, The Buttery, Cheesy, Crispy-Edged Method'
description: '70% hydration dough, par-baked then flipped, blanketed in three cheeses with a frico-crispy edge. The pan pizza you make on a Tuesday and remember on Friday.'
