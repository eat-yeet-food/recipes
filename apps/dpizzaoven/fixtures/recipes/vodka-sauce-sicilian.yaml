created: '2026-04-19'
blocks:
  - type: recipe
    equipment:
      - lloyds sicilian
      - baking steel
    ingredients:
      - title: Dough (1 ball for 12×12 pan)
        items:
          - 550 g Sicilian pizza dough (see Sicilian Pizza Dough recipe)
      - title: Vodka sauce
        items:
          - '1 batch vodka sauce (from Vodka Burrata recipe above, makes enough for 2 Sicilians)'
      - title: Top
        items:
          - '8 oz low-moisture whole-milk mozzarella, shredded'
          - '4 oz fresh mozzarella, torn, drained'
          - 20-25 slices cup-and-char pepperoni
          - microplaned Parmigiano-Reggiano
          - torn fresh basil
          - olive oil finish
    steps:
      - title: Prep the pan
        items:
          - 'Generously oil a 12×12 Lloyds Sicilian pan (3 tablespoons olive oil, spread into all corners).'
          - '*You''ll know it''s right when:* Oil should fully coat the pan, including all four corners and up the sides about 1/2 inch. Tilt the pan, the oil should pool slightly in the corners. Don''t skimp, this oil is what fries the bottom into the signature crispy texture.'
      - title: Transfer dough
        items:
          - 'Move cold dough into the oiled pan. Oil your fingertips and press it flat, pushing into corners. If it resists, wait 15 min and try again. Cover loosely.'
          - '*You''ll know it''s right when:* Cold dough resists hard. Get it to 70% of the pan, cover, wait 15 minutes. The rest lets gluten relax. After waiting, it should press out easier. Don''t force a cold dough, you''ll tear it.'
      - title: Room-temp rise
        items:
          - Let rise 4-5 hours at room temperature until visibly bubbly and filling about 3/4 of the pan depth.
          - '*You''ll know it''s right when:* After 4-5 hours, the dough should fill the pan corner-to-corner, have visible large bubbles on the surface, and reach about 3/4 of the pan depth. Press gently, it should slowly spring back about halfway. If still flat, give it another hour.'
      - title: Build
        items:
          - About 3/4 cup vodka sauce spread across the top. Shredded mozz to the edges. Dot with torn fresh mozz. Pepperoni laid edge-to-edge.
          - '*You''ll know it''s right when:* Sauce should be enough to coat but not flood, ~3/4 cup for a 12x12 pan. Shredded mozz to the edges (touching the pan sides for the frico crust). Pepperoni in a single layer covering most of the surface, slices touching but not overlapping.'
      - title: Bake
        items:
          - '500°F on a Baking Steel (middle rack), 18-22 min until the top is browned and the bottom is deeply crispy. Lift a corner with a spatula to check, you want a golden, almost fried, bottom.'
          - '*You''ll know it''s right when:* Top should be deeply browned with bubbly cheese, charred-edge pepperoni cups, and visible oil pools. Lift a corner with a thin spatula and inspect the bottom: deep golden-brown, almost fried-looking with crispy edges. If bottom is pale, give it 3-4 more minutes.'
      - title: Finish
        items:
          - 'Out of oven: let sit 3 minutes (the steam needs to escape so the bottom stays crisp). Slide onto a cutting board using a big spatula. Microplaned parm, torn basil, olive oil drizzle. Cut into 9 squares.'
          - '*You''ll know it''s right when:* After 3 minutes rest, the pizza should slide out of the pan as a unit when you nudge it with a spatula. If it sticks, run the spatula around the edges. Cut in a 3x3 grid for 9 squares. Each corner square has more frico crust, claim those for yourself.'
    notes:
      - 'Oil the pan heavy. Skimp on oil and you lose the fry-bottom effect that makes this style special. If the bottom isn''t crisp when you check, let the pizza sit on the steel for another 3-4 min with the top covered in foil.'
      - '**Bottom of the Sicilian was pale and limp, not crispy** Not enough oil in the pan, OR pan wasn''t placed on a preheated baking steel, OR oven temp too low. 3 tablespoons of oil minimum, spread into corners. Place pan on preheated baking steel/stone, the conductive heat from below browns the bottom. 500°F minimum, 18-22 minute bake.'
      - '**Cheese didn''t form a frico crust at the pan edges** Cheese didn''t extend to the pan walls, OR you used pre-shredded cheese. Shredded mozz must touch the pan walls all around. Use hand-shredded cheese from a block. Pre-shredded has anti-caking agents that prevent the browning.'
      - '**Crust was dense, not airy** Insufficient final rise in the pan, OR you pressed too aggressively (deflating the gas). Full 4-5 hour final rise at room temp. Don''t poke or press the dough during the rise. Cover loosely with plastic so it doesn''t form a skin.'
      - '**Sauce flooded and made the dough soggy** Too much sauce OR sauce was too thin from not reducing enough. 3/4 cup is the right amount for a 12x12 pan. If sauce looks watery, simmer longer until it coats a spoon thickly. Vodka sauce should be thick enough to mound, not runny.'
      - '**Cheese on top burned before bottom was crispy** Pan was on the upper rack OR oven temp set too high. Middle rack with pan on a baking steel underneath. 500°F not 525°F. If cheese is browning too fast at minute 12-14, tent loosely with foil for the rest of the bake.'
      - '**Pepperoni didn''t cup** Used standard deli pepperoni instead of natural-casing cup-and-char. Need Ezzo, Rosa Grande, or Battistoni brand. Regular Hormel will lay flat. The cups are the whole point, that''s where the spiced oil pools.'
      - '**Pizza stuck to the pan, ripped apart** Insufficient oil OR Lloyds pan not seasoned (new pan). 3 tablespoons oil minimum, spread into corners and up sides. New Lloyds pans need seasoning: thin oil coat at 400°F for 1 hr, repeat 2-3 times. After 5-10 uses they''re effectively non-stick.'
