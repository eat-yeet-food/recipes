    ingredients:
      - title: Ingredients
        items:
          - 250 g Caputo GF Flour
          - 240 g room temp water
          - 5 g instant yeast
          - 5 g sugar
          - 7 g salt
          - 12 g olive oil
      - title: butter
        items:
          - 1 cup shredded low moisture part skim mozzarella
          - 1 cup shredded low moisture whole milk mozzarella
          - ½ cup shredded white cheddar
          - pizza sauce
    steps:
      - title: Add all of your dry ingredients to a large bowl and mix
        items:
          - 'Add all of your dry ingredients to a large bowl and mix. 250 g Caputo GF Flour, 5 g instant yeast, 5 g sugar, 7 g salt'
      - title: Then add your wet ingredients and mix with a spatula until
        items:
          - 'Then add your wet ingredients and mix with a spatula until no dry bits are remaining. Should only take a couple minutes to bring together. It will look like a literal paste. 240 g room temp water, 12 g olive oil'
      - title: 'Next, generously oil your Detroit pan on the bottom and all'
        items:
          - 'Next, generously oil your Detroit pan on the bottom and all sides. 12 g olive oil'
          - '*You''ll know it''s right when:* Oil should fully coat the bottom and run up the sides about 1/2 inch. Tilt the pan, oil should pool slightly in the corners. Skimping = batter stuck to the pan forever.'
      - title: Scrape your dough into the pan
        items:
          - Scrape your dough into the pan.
      - title: Lightly oil or spray oil on top of the dough
        items:
          - Lightly oil or spray oil on top of the dough. Then use your spatula to evenly spread it out in the pan across the entire bottom surface.
          - '*You''ll know it''s right when:* Batter should reach all 4 corners, roughly uniform thickness. Don''t worry about perfect flatness, the rise will even it out. Surface should glisten slightly from the top oil.'
      - title: Cover with plastic wrap and leave on the counter for two
        items:
          - Cover with plastic wrap and leave on the counter for two hours.
          - '*You''ll know it''s right when:* After 8 hours, dough should have at least doubled in volume, surface should be bubbly and slightly domed. If it starts sinking (visible deflation), that''s PAST peak, bake immediately. Pre-peak: still rising. Peak: max height + small bubbles popping.'
      - title: 'After one hour, preheat your oven to 500 degrees'
        items:
          - 'After one hour, preheat your oven to 500 degrees.'
      - title: 'After the second hour, it''s time to bake'
        items:
          - 'After the second hour, it''s time to bake. Remove the plastic wrap and bake for 10 minutes.'
      - title: 'Now that the dough is par baked, remove with a metal'
        items:
          - 'Now that the dough is par baked, remove with a metal spatula and rest on a cooling rack for 20 minutes. This allows time for the pan to cool as well.'
      - title: 'Once cooled, generously oil or butter your pan'
        items:
          - 'Once cooled, generously oil or butter your pan. I prefer butter. Some like using crisco as well. to each their own. butter'
      - title: Place the par baked dough in the pan and you are ready to
        items:
          - Place the par baked dough in the pan and you are ready to make your pizza! For the pizza
      - title: I like lacing the edges with part skim mozzarella because
        items:
          - I like lacing the edges with part skim mozzarella because they crisp up better. 1 cup shredded low moisture part skim mozzarella
      - title: Spread the whole milk mozzarella and white cheddar in the
        items:
          - 'Spread the whole milk mozzarella and white cheddar in the middle. 1 cup shredded low moisture whole milk mozzarella, ½ cup shredded white cheddar'
      - title: Top with your pizza sauce
        items:
          - Top with your pizza sauce. I prefer my "herby" version which is attached as a sub recipe. pizza sauce
      - title: Top with the rest of your toppings
        items:
          - Top with the rest of your toppings.
      - title: Bake at 500 degrees for another 6 minutes
        items:
          - Bake at 500 degrees for another 6 minutes. Broil for one to crisp up the cheese.
          - '*You''ll know it''s right when:* After 8 min: cheese fully melted and bubbling, edges starting to brown. After 1 min broil: char spots on cheese surface, edges deeply browned. STAND at oven during broil, 60 sec = perfect, 90 sec = burnt.'
      - title: Remove from oven and let sit for five minutes
        items:
          - Remove from oven and let sit for five minutes.
      - title: Then carefully scrape remove from the pan with your spatula
        items:
          - Then carefully scrape remove from the pan with your spatula. Separating the fried cheesy edges from the pan.
      - title: Cut up and enjoy!
        items:
          - Cut up and enjoy!
    notes:
      - 'This is one of the best gluten-free pizzas I''ve ever made, wheat-eaters request it. The 96% hydration batter approach and the par-bake-then-rack-rest flow are what separate this from every dense, sandy GF pizza you''ve ever had. Treat the recipe like a science experiment, follow the steps, and don''t try to make the batter more ''dough-like.'' Trust the process.'
      - '**Crust was dense and gummy, not pillowy** Skipped the par-bake, or didn''t give the dough its full rise time. Both matter. Let the dough rise until visibly puffy per the steps, then par-bake before adding toppings. Skipping either step gives you dense GF Detroit.'
      - '**Bottom was soggy, not crispy** The par-baked dough steamed on a solid surface instead of a rack. Rest the par-baked dough on a wire cooling rack so steam escapes from the bottom. That dry bottom is what fries up crisp on the final bake.'
      - '**Dough didn''t rise much in the 3-hour window** Yeast was dead, or the kitchen was cold. Check yeast freshness. In a cold kitchen, park the pan somewhere warm (top of the fridge, oven with just the light on). The dough should be visibly puffy before it goes in the oven.'
      - '**Cheese edge didn''t form frico** Cheese didn''t touch the pan walls. Press the cheese firmly against the pan walls all the way around. Cheese-to-metal contact is what creates the caramelized edge. Any gap means no frico there.'
      - '**Tried a different GF flour and it was bland and crumbly** Caputo''s blend is uniquely suited to this high-hydration technique. Order Caputo Fioreglut from Amazon (about $15 a bag). The texture difference is significant; this isn''t snobbery, the recipe is built around it.'
      - '**Tried to make this in a regular cake pan and it came out wrong** Detroit pans have specific geometry and heat behavior. Use a real Detroit steel pan (Lloyds is the standard, about $30 on Amazon). In a pinch, a similar-size metal baking pan works better than glass or ceramic, but expect less frico edge.'
    tips:
      - '**Use Caputo Gluten Free flour specifically.** Other GF blends work but produce denser, more crumbly results. Caputo''s proprietary blend is what makes this recipe actually taste like pizza. Available on Amazon for ~$15/bag (enough for 4-5 pizzas).'
      - '**This is a batter, not a dough, don''t try to fix it.** When you mix the wet and dry, it''ll look like thick pancake batter. That''s correct. Don''t add more flour to make it ''doughy'', you''ll ruin the texture. Trust the 96% hydration and pour it into the pan.'
      - '**Use a real Detroit pan or 8x10 baking pan.** A regular cake pan or round pan changes the geometry and you won''t get the frico cheese edges that make Detroit pizza great. [Lloyd Pans 8x10](https://www.amazon.com/Lloyd-Pans-Aluminized-Detroit-Pizza/dp/B00ARYIE08) is my pick. Cast iron works but the proportions are slightly off.'
      - '**Don''t skimp on the first oil layer in the pan.** Pour enough olive oil to coat the entire bottom AND sides of the pan. This batter will stick everywhere if the pan isn''t properly slicked. 1-2 tablespoons is right.'
      - '**Set a 9-hour timer when you mix the dough.** 8 hours is the minimum rise. Aim for 9 because you''ll need 1 hour for the oven to preheat to 500°F. If you start at 8pm, plan to bake at 5am... or do this the morning of and bake at dinner.'
      - '**The dough is risen when it doubles in volume.** It will look puffy and slightly domed in the pan. If you see it start to deflate, that''s peak, bake immediately. If you bake before it doubles, you''ll get a dense crust.'
      - '**Cool upside-down on a rack, don''t skip this.** Flipping the par-baked crust onto a rack lets steam escape from what will become the bottom of the final pizza. Trap that steam and you''ll have a soggy bottom forever. 20 minutes minimum, longer is fine.'
      - '**Freeze the par-baked crusts for weeknight pizza.** Wrap each cooled par-baked dough in plastic + foil and freeze up to 2 weeks. Pull out 30 min before baking. This is the GF pizza hack that changes the game, weeknight gluten-free pizza becomes a 15-minute meal.'
      - '**Detroit sauce-on-top is traditional but optional.** Real Detroit pizza puts the sauce ON TOP of the cheese after baking (or on top before baking). I do whatever I want. Sauce-on-top tastes brighter and protects the cheese. Sauce-under is more familiar. Both work, try both, pick your favorite.'
