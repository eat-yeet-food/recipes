blocks:
  - type: recipe
    equipment:
      - baking steel
    ingredients:
      - title: Ingredients
        items:
          - 547 g bread flour
          - 23 g cornmeal
          - 3 g instant yeast
          - 12 g salt
          - 6 g sugar
          - 285 g water (90°)
          - 45 g olive oil
    steps:
      - title: Combine dry ingredients in a bowl and give a quick mix
        items:
          - Combine dry ingredients in a bowl and give a quick mix.
          - '*You''ll know it''s right when:* You should see the cornmeal flecked evenly through the white flour, no clumps. Those flecks are what give the finished crust its crunch points, so make sure they''re spread out.'
      - title: Add the wet ingredients and mix with a spoon or spatula
        items:
          - Add the wet ingredients and mix with a spoon or spatula until everything comes together.
          - '*You''ll know it''s right when:* At 52% hydration this is a stiff, dry-feeling dough, much firmer than a NY dough. It should just barely come together with no dry flour left in the bowl. If there are dry bits, add water 1 teaspoon at a time.'
      - title: Cover and let rest for 30 minutes
        items:
          - Cover and let rest for 30 minutes
          - '*You''ll know it''s right when:* After 30 minutes the dough should look slightly smoother and feel less stiff. The rest does some of the gluten work for you, so the knead is quick.'
      - title: 'After 30 minutes, knead the dough for 2-3 minutes'
        items:
          - 'After 30 minutes, knead the dough for 2-3 minutes.'
      - title: Cut the dough into two and form doughballs the best you can
        items:
          - Cut the dough into two and form doughballs the best you can. Try to pinch the bottom seam shut.
          - '*You''ll know it''s right when:* Each ball should be tight and smooth on top with a sealed pinch underneath. With stiff dough the balls hold their shape easily, no slumping.'
      - title: Lightly oil your dough proofing containers
        items:
          - Lightly oil your dough proofing containers. Place dough in there and cover.
          - '*You''ll know it''s right when:* Cold ferment (1-2 days) gives deeper flavor and is the move if you can plan ahead. After a 1-hour counter proof, the dough will be barely puffed, that''s fine for this style, it doesn''t need a big rise.'
      - title: 'Ideally, you let it rest in the fridge for 1-2 days, but if'
        items:
          - 'Ideally, you let it rest in the fridge for 1-2 days, but if you want pizza quickly, you can rest for an hour on the counter'
          - '*You''ll know it''s right when:* Cold ferment (1-2 days) gives deeper flavor and is the move if you can plan ahead. After a 1-hour counter proof, the dough will be barely puffed, that''s fine for this style, it doesn''t need a big rise.'
      - title: 'After resting at room temp for an hour, heavily flour your'
        items:
          - 'After resting at room temp for an hour, heavily flour your counter surface, then flour the top of the dough, and roll the dough out as thin as possible. Rotating, flipping, and flouring more as needed.'
          - '*You''ll know it''s right when:* Roll until you can almost see the counter through the dough, about 1/8 inch. The thinner you go, the crispier the result. Keep dusting with flour so it never sticks or tears.'
      - title: Once the dough is 14-16 inches (You can use a pizza cutter
        items:
          - 'Once the dough is 14-16 inches (You can use a pizza cutter to create a circle), use a fork to poke a bunch of holes or a docking tool.'
          - '*You''ll know it''s right when:* Dock the entire surface, dozens of holes, every inch or so. The holes stop the thin crust from bubbling up into big air pockets during the bake, keeping it flat and even. You want it looking thoroughly perforated, like in the video.'
      - title: 'From here, you have 3 options: 1)Immediately top your pizza'
        items:
          - 'From here, you have 3 options: 1)Immediately top your pizza and bake it. 2)Leave on the counter, uncovered for 12-24 hours. 3)Leave in the fridge uncovered for 12-24 hours. This is called "curing."'
          - '*You''ll know it''s right when:* Curing is the secret to the crispiest tavern crust. If you cure, the surface will dry out and feel firm and slightly leathery to the touch after 12-24 hours. That dried side becomes the BOTTOM of your pizza and bakes up shatteringly crisp.'
      - title: 'If you choose to cure the dough, the harder, leathery'
        items:
          - 'If you choose to cure the dough, the harder, leathery surface will become the bottom of your dough.'
      - title: Preheat the oven to 500 degrees
        items:
          - Preheat the oven to 500 degrees. I like to sauce and cheese all the way to the edges. add as many toppings as you like. And bake for 10 minutes.
          - '*You''ll know it''s right when:* Push the cheese right to the very edge so it touches and crisps into frico, the caramelized cheese lace that defines tavern and bar pizza. Any bare crust margin means you left flavor and crunch on the table.'
      - title: ENJOY!!
        items:
          - ENJOY!!
    notes:
      - 'Two things make this the crispiest pizza I make: the cornmeal in the dough and the curing step. Don''t skip the cure if you want maximum crunch, the dried, docked surface becomes a shatteringly crisp bottom. And remember this is its own thing, not my [bar pie](/recipes/bar-pie). Bar pie is the fast same-day version; Tavern Style is the plan-ahead, max-crunch version.'
      - '**Crust wasn''t as crispy as I hoped** You skipped the curing step, OR didn''t roll it thin enough. Curing is the whole game for maximum crunch, leave the docked dough uncovered 12-24 hours (counter or fridge) before topping. The dried surface bakes up shatteringly crisp. Also roll thinner, aim for 1/8 inch, almost see-through.'
      - '**The crust bubbled up into big air pockets** You didn''t dock the dough, or didn''t dock it thoroughly enough. Poke holes all over the surface with a fork or docking tool, every inch or so, dozens of holes. Docking lets steam escape so the thin crust stays flat instead of ballooning.'
      - '**Dough was way too stiff and hard to roll** This is a low-hydration (52%) dough, it''s supposed to be firm, but if it''s cracking it may have needed a touch more water or more resting. Make sure you did the 30-minute rest after mixing, it hydrates the flour and cornmeal and makes rolling easier. Let cold-fermented dough warm up at room temp for a full hour before rolling. If it still fights you, add water 1 teaspoon at a time on the next batch.'
      - '**Dough kept sticking to the counter while rolling** Not enough flour on the surface or the dough top. Heavily flour the counter AND the top of the dough, and re-flour every time you rotate or flip. This is a roll-out dough, not a hand-stretch dough, so a well-floured surface is essential.'
      - '**Cheese didn''t crisp at the edges** You left a bare crust rim, or used pre-shredded cheese. Push the cheese all the way to the edge so it touches the pan and frico''s up. Hand-shred low-moisture whole-milk mozzarella from a block, the anti-caking starch on pre-shredded cheese prevents a proper crispy edge.'
      - '**Bottom burned before the top was done** Oven or steel too hot, or pizza too close to the bottom element. 500°F is the target. If your steel runs hot, bake on a middle rack. The thin crust cooks fast, so watch it from minute 7 on and pull when the cheese is browned and the bottom is rigid.'
