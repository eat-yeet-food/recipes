    equipment: []
    ingredients:
      - title: Ingredients
        items:
          - 130 g browned butter
          - 40 g butter
          - 160 g dark brown sugar
          - 50 g white sugar
          - 1 egg (room temp)
          - ¼ tsp salt
          - ½ tsp espresso powder
          - 1 tbsp vanilla paste
          - 195 g all purpose flour
          - ½ tsp baking soda
          - ¼ tsp baking powder
          - ½ cup dark chocolate chips
          - ½ cup semi sweet chocolate chips
          - Flakey sea salt
    steps:
      - title: Preheat oven to 350 degrees
        items:
          - Preheat oven to 350 degrees
      - title: Brown butter in a sauté pan
        items:
          - 'Brown butter in a sauté pan. Should take about 5 minutes. Once it fizzes up and you can see browned bits, kill the flame.'
      - title: Pour the butter into a bowl and add the other butter (cubed)
        items:
          - Pour the butter into a bowl and add the other butter (cubed). Stir until it dissolves.
      - title: Put into the fridge for 20 minutes or so
        items:
          - Put into the fridge for 20 minutes or so. I aim for a temperature of 60 degrees
      - title: Add the brown sugar and white sugar to the butter
        items:
          - Add the brown sugar and white sugar to the butter. Whisk/stir for 2-3 minutes until well combined
      - title: Add the egg and vanilla paste and mix for another minute
        items:
          - Add the egg and vanilla paste and mix for another minute until well combined.
      - title: Add the rest of the dry ingredients in a bowl and mix
        items:
          - Add the rest of the dry ingredients in a bowl and mix. Then add to the wet ingredients.
      - title: Slowly mix and incorporate
        items:
          - Slowly mix and incorporate. It's important not to overmix here.
      - title: 'Once there''s just a little flour still visible, add the'
        items:
          - 'Once there''s just a little flour still visible, add the chocolate chips. Gently mix until chips are evenly incorporated.'
      - title: 'Make 12 balls, about 65 grams each'
        items:
          - 'Make 12 balls, about 65 grams each. Try to keep some chocolate chips on top (it just looks prettier).'
      - title: Chill in the fridge for at least 20 minutes
        items:
          - Chill in the fridge for at least 20 minutes. But they are best if they've been chilled for 24-48 hours. Or you can freeze for later use.
      - title: Place on a baking sheet with parchment paper and put in the
        items:
          - Place on a baking sheet with parchment paper and put in the oven.
      - title: 'About 5 minutes in, slam the tray of cookies on the counter'
        items:
          - 'About 5 minutes in, slam the tray of cookies on the counter or rack once or twice to flatten them out.'
      - title: 'Once baked, add flaky sea salt then let sit on the counter'
        items:
          - 'Once baked, add flaky sea salt then let sit on the counter on the pan for 15-20 minutes. ENJOY!'
    notes:
      - 'Don''t skip the brown butter step, it''s the entire point. If you accidentally burn it (black bits, acrid smell), throw it out and start over. Browned ≠ burned. For chunky cookies, chop the chocolate by hand, chocolate chips have stabilizers that prevent the same melting behavior.'
      - '**Butter burned (black spots, acrid smell) instead of browned** Heat too high, OR walked away from the pan. Medium heat, not high. STAND AT THE PAN, the difference between browned and burned is 30 seconds. If you see black bits or smell acrid burnt smell, throw it out and start over. Brown ≠ burnt.'
      - '**Cookies spread too thin and turned into pancakes** Brown butter wasn''t cooled enough before adding sugar, OR didn''t chill the dough. Brown butter should cool 15 minutes minimum (room temperature) before mixing with sugar. Warm butter melts sugar prematurely and creates flat cookies. ALWAYS chill the dough at least 1 hour before scooping.'
      - '**Cookies were dry and crumbly** Over-baked, OR used too much flour. Pull at 12 minutes if your oven runs hot. Centers should look slightly underdone (pale, puffy) when you pull them. They keep cooking on the sheet. Measure flour by weight (300g), not volume.'
      - '**No chocolate pools, just uniform chip distribution** Used chocolate chips instead of chopping chocolate by hand. Chocolate chips have stabilizers that prevent them from melting into pools. Buy a bar of 60-70% dark chocolate and chop it unevenly by hand with a chef''s knife. The large irregular chunks create the molten pools.'
      - '**Brown butter step was a disaster, scared to try again** Common first-time issue. The window between browned and burned is narrow. Three rules: light-colored pan (to see the color change), medium heat (never high), stand and stir constantly. When milk solids turn deep golden and you smell nutty/toasted aroma, immediately pour out of the pan. Practice makes this confident.'
      - '**Cookies were puffy/cakey, not chewy** Over-mixed the flour OR used too much baking soda. Fold flour in JUST until incorporated, no more. Visible chocolate streaks mean stop. 1 tsp baking soda is correct, don''t go higher.'
      - '**Skipped the 24-hour rest, cookies were just okay** Same-day cookies don''t develop the deep brown butter flavor that overnight rest creates. If you can plan ahead, rest 24 hours. The texture, color, and depth of flavor are noticeably better. If you can''t, 1-hour rest is the minimum, NEVER skip entirely.'
