slug: 24-hour-room-temp-dough
title: 24+ Hour Room-Temperature Pizza Dough
description: 'The exact room-temp dough I actually make. Bread + AP flour blend, 0.06% yeast, 20 hours on the counter. Three 12-inch pizzas.'
