blocks:
  - type: recipe
    equipment:
      - baking steel
      - bianco whole
    ingredients:
      - title: Dough (makes 2-3 × 12" pizzas)
        items:
          - 210 g active sourdough starter (20%)
          - 350 g bread flour
          - 75 g all-purpose flour
          - '240 g water (60°F, 65%)'
          - 14 g salt (2.5%)
          - 11 g sugar (2%)
          - 11 g olive oil (2%)
    steps:
      - title: Add water to a large mixing bowl
        items:
          - 'Use cold tap water, around 60°F. Warmer water kickstarts the starter too aggressively and you lose control of the timeline.'
      - title: Add your active sourdough starter
        items:
          - '210 grams of active, bubbly starter, fed 6-8 hours before mixing and at peak rise. If your starter looks flat or sluggish, stop and feed it again. Active starter is 70% of whether this recipe works.'
          - '*You''ll know it''s right when:* Active starter floats: drop a teaspoon into water, if it floats, it is ready. If it sinks, not active enough. Should be visibly bubbly with a domed top, not flat or sunken.'
      - title: Mix to break up the starter
        items:
          - 'Stir with a wooden spoon or your hand until the starter is mostly dispersed in the water. Don''t worry about getting it perfectly smooth, a few visible chunks is fine. They''ll incorporate during kneading.'
      - title: Add olive oil and mix to disperse
        items:
          - Pour in the olive oil and stir to spread it through the water-starter mixture. The oil adds tenderness to the final dough and helps prevent sticking.
      - title: Add all your dry ingredients
        items:
          - 'Pour in the bread flour, AP flour, salt, and sugar all at once. Don''t pre-mix the dry ingredients, it''s not necessary at this scale and the wet ingredients are already in the bowl.'
      - title: Mix until almost all dry bits are incorporated
        items:
          - 'Use a rubber spatula or wooden spoon. Mix until the dough comes together as a shaggy mass with only a few dry pockets left. It''ll look rough and uneven, that''s fine.'
      - title: Dump onto a clean surface and knead 5 minutes
        items:
          - 'Turn the shaggy dough onto a clean countertop. Knead with your hands for 5 minutes. It will be sticky at first, scrape the dough off your hands with a bench scraper as needed. The stickiness disappears as the gluten develops. Don''t add flour to fight it; just be patient.'
          - '*You''ll know it''s right when:* After 5 minutes, dough should be smooth and slightly tacky to touch. Should pull off the counter cleanly. Tacky lifts cleanly; sticky leaves dough on counter.'
      - title: 'Optional: pre-rest if too sticky'
        items:
          - 'If the dough is too sticky to knead even with scraping, cover it and let it rest on the counter for 15-20 minutes. The flour absorbs more water during this rest and the dough becomes much more workable. Then knead.'
      - title: Lightly oil a container and rest 30 minutes
        items:
          - 'Transfer the kneaded dough to a lightly oiled container. Cover with plastic wrap or a damp towel. Let it rest on the counter for 30 minutes, this is the first ''bulk fermentation'' rest.'
      - title: Perform 4 stretch and folds
        items:
          - 'Wet your hands first to prevent sticking. Grab the dough from one side, lift it up, and fold it over to the opposite side. Rotate the bowl 90° and repeat. Four total folds, one for each side. This builds tension and gluten structure.'
      - title: Cover and rest another 30 minutes
        items:
          - Re-cover the container and let the dough rest for another 30 minutes. The gluten relaxes during this rest and prepares for the next round of stretch-and-folds.
      - title: 'Window pane test, repeat up to 4 times'
        items:
          - 'Pinch off a small piece and gently stretch it thin between your fingers. If you can see light through it without tearing, the gluten is fully developed and you''re ready for the next step. If it tears, do another round of stretch-and-folds, rest 30 minutes, and test again. Usually 2-3 rounds total.'
          - '*You''ll know it''s right when:* Should stretch into a thin film for 2-3 inches before tearing. Sourdough takes more folds than commercial-yeast doughs, expect 3-4 rounds, not 2.'
      - title: Divide the dough into 2-3 pieces
        items:
          - Three pieces = three 12-inch pizzas (about 295g each). Two pieces = two 14-15-inch pizzas (about 440g each). Choose based on the size you want to bake.
      - title: Ball the dough
        items:
          - 'Shape each piece into a tight round. Pull the edges underneath and pinch them together at the bottom, working around the ball to build surface tension. Place seam-side down on a lightly oiled tray.'
          - '*You''ll know it''s right when:* Each ball should be smooth and taut on top with a sealed pinch underneath. Sourdough is slightly slacker than commercial-yeast doughs, but surface should still feel taut.'
      - title: 'Optional: refrigerate up to 12 hours'
        items:
          - 'If you''re not ready to bake within 3-5 hours, you can hold the balled dough in the fridge for up to 12 hours. DO NOT exceed 12 hours, the high 20% starter percentage means the dough will over-proof past that. If you need longer storage, the wrong recipe choice was made, use my [classic NY dough](/recipes/classic-ny-pizza-dough) (48-72 hour cold ferment) instead.'
      - title: Rest dough on the counter 3-5 hours
        items:
          - 'Cover the balls loosely with plastic wrap or a damp towel. Let them rest at room temperature for 3-5 hours. The dough is ready when: it feels soft and pillowy, a finger press leaves a slow-recovering dent (not springy), and you can see small bubbles on the surface.'
          - '*You''ll know it''s right when:* Balls should puff visibly and feel pillowy. Press a fingertip gently, indent should slowly spring back about halfway. If still snapping back fully after 5 hours, kitchen too cold.'
      - title: Make your pizza!
        items:
          - 'Hand-stretch each ball to 12 inches on a floured peel. Top with sauce, low-moisture mozzarella, and whatever else you want. Launch onto a preheated Baking Steel at 550°F. Bake 6-8 minutes until the crust is golden, the cheese has dark spots, and the bottom is leopard-spotted. Eat hot.'
          - '*You''ll know it''s right when:* Sourdough crust bakes with darker leopard spotting and a tangier crumb than commercial-yeast doughs. Pull when crust is golden brown with dark spots on the rim.'
    notes:
      - 'Sourdough pizza is a different beast from commercial-yeast pizza. The flavor is more complex, the crust has more chew, and there''s a subtle tang that you don''t get from regular pizza dough. This same-day method gives you most of that flavor in 6 hours instead of 2-3 days. The tradeoff is needing an active starter, but if you have one and you''re feeding it regularly, this is the most rewarding pizza dough on the site. Try it once and you''ll see why.'
      - '**Dough barely rose after 6 hours** Starter wasn''t active enough. This is the #1 cause of sourdough failure. Starter must be ACTIVE: fed 6-8 hours before, doubled in volume, peaked with bubbles. Float test: drop a teaspoon in water, it should float. If your starter is sluggish, do two feedings 12 hours apart over the day before, then try again. There''s no shortcut around starter health.'
      - '**Dough was too acidic and tasted unpleasantly tangy** Starter was over-ripe (past peak, sunken middle), or fermented too long during bulk rise. Use starter at peak (4-8 hours after feeding, depending on temperature). Don''t let it sit past 12 hours after feeding. If kitchen is warm, reduce bulk ferment time by an hour.'
      - '**Crust was dense, not airy like sourdough should be** Insufficient gluten development OR not enough bench proof. Window pane test must pass before bulk ferment. Sourdough takes more fold rounds than commercial yeast (3-4 vs 2). After balling, full 3-5 hours bench proof. Cold dough won''t have airy crumb.'
      - '**Dough was way too slack and wet to handle** Starter hydration affects total dough hydration. If your starter is 100% hydration, the dough is at 65%. If at 125% hydration, dough is closer to 67-68%. Standard 100% hydration starter (equal weights flour and water) is what this recipe assumes. If yours is higher, reduce water in the recipe by 10-15g to compensate.'
      - '**Tried to refrigerate balls past 12 hours and they overproofed** 20% starter is a lot of yeast activity. Even cold, it keeps fermenting. Don''t push past 12 hours in the fridge. If you need longer hold, use my [classic NY pizza dough](/recipes/classic-ny-pizza-dough) (commercial yeast, 48-72 hour cold ferment) instead.'
      - '**I tried with ''kind of bubbly'' starter and dough failed** ''Kind of bubbly'' isn''t active. Sourdough is binary, either ready or not. Starter must clearly DOUBLE in volume after feeding, have visible bubbles throughout, and show a domed top. If it''s flat or only slightly risen, it''s not ready. Do another feeding cycle and wait.'
    tips:
      - '**Test your starter the night before.** Feed it at 8pm, check at 8am. If it''s tripled in volume with visible bubbles and a domed top, you''re ready. If it''s flat or barely risen, do another feeding cycle 12 hours later and try again the next day. Don''t attempt this recipe with a sluggish starter, you''ll be disappointed.'
      - '**60°F water is the temperature target.** Warm water kickstarts the starter too aggressively and you lose control of the timeline. Cold water (40-50°F) slows the starter too much. 60°F (cold tap water in most US homes) is the goldilocks zone for keeping the starter active but controlled.'
      - '**The 5-minute knead is the minimum.** Some sourdough recipes skip kneading entirely and rely on stretch-and-folds. That''s fine for higher hydration breads but pizza dough at 65% benefits from the initial knead. It builds the basic gluten structure that stretch-and-folds then refine.'
      - '**Window pane test is non-negotiable.** The 30-minute rest cycle continues until the dough passes window pane. Usually 2-3 rounds total. Some doughs pass after one round; others need four. Trust the test, not the timer.'
      - '**Ball tightly.** Sourdough doughs can be sticky and unwilling to hold a shape. Use a bench scraper, a small amount of flour on your hands, and pull the dough into itself underneath. A tight ball stretches into a much better pizza than a loose, slack one.'
      - '**Don''t refrigerate past 12 hours.** The 20% starter percentage means the dough is fermenting fast. Past 12 hours in the fridge, you''ll get over-proofed dough that''s slack, alcoholic-smelling, and impossible to stretch cleanly. If you need to hold longer, you need a different recipe, see my [classic NY dough](/recipes/classic-ny-pizza-dough).'
      - '**3-5 hours room temp after balling is the proof.** Once balled, the dough needs to come back up to peak before stretching. Watch for: dough that''s relaxed (a finger press leaves a slow-recovering dent), visibly bubbled on the surface, smells lightly fermented. That''s your green light.'
