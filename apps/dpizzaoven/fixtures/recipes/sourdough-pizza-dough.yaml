slug: sourdough-pizza-dough
title: Same-Day Sourdough Pizza Dough
description: 'Active starter, no commercial yeast, 6 hours from mix to pie. The sourdough pizza dough I make when I want depth of flavor without a 3-day fermenting commitment.'
