    ingredients:
      - title: Basic Sauce
        items:
          - 1 can crushed tomatoes
          - 1 tsp salt
      - title: Herby Variation
        items:
          - 1 tsp salt
          - 2 basil leaves
          - ½ tsp oregano
          - 1 tsp olive oil
    steps:
      - title: Combine 1 can of crushed tomatoes with 1 teaspoon of salt
        items:
          - Combine 1 can of crushed tomatoes with 1 teaspoon of salt. My go-to is Bianco DiNapoli Herby Variation
      - title: 'Add 1 teaspoon of salt, 2 basil leaves, 1/2 teaspoon of'
        items:
          - 'Add 1 teaspoon of salt, 2 basil leaves, 1/2 teaspoon of oregano, and 1 teaspoon of olive oil to the basic sauce.'
          - '*You''ll know it''s right when:* Tear the basil leaves before adding, releases more oil and aroma. Smell test after adding all herbs, should smell distinctly of basil + oregano + olive oil, not just tomato. If aroma is muted, herbs need more time or you need fresher herbs.'
      - title: Lightly pulse with a blender or immersion blender
        items:
          - Lightly pulse with a blender or immersion blender. Do not overdo the blending.
      - title: Serve immediately or store in the fridge for up to 2-3 days
        items:
          - Serve immediately or store in the fridge for up to 2-3 days.
    notes:
      - Crushed tomatoes tend to have a thicker consistency and are more acidic.
      - '**Sauce tasted bland and watery** Used the cheaper San Marzano-style canned tomatoes (not real DOP) or generic brand. The tomatoes are 95% of the sauce. Bianco DiNapoli ($5-8 per can) or San Marzano DOP (look for the official seal). The flavor difference between premium and generic is massive. One can makes 4-5 pizzas; the extra cost works out to $1 per pizza.'
      - '**Sauce was too acidic, mouth-puckering** Cheap tomatoes with high acid content, OR not enough salt. First try MORE salt before reaching for sugar. Most acidity complaints are actually salt deficiencies. If salt doesn''t fix it, you have bad tomatoes, buy better ones next batch.'
      - '**Over-blended the herby version and now sauce is watery** Immersion blender pulverized the tomato cell walls and released too much water. 3-5 short pulses MAX, less than 5 seconds total blending. Going beyond breaks the sauce structure. If already over-blended, can''t be fixed, just use it (it''ll still taste fine, just not perfect texture).'
      - '**Tried to cook the sauce and it got dark and concentrated** You followed instincts from spaghetti sauce. Pizza sauce is NEVER cooked. Use uncooked. The pizza bake (4-8 minutes at 500°F+) does all the cooking the sauce needs. Pre-cooking turns bright fresh tomato into dark concentrated paste, that''s pasta sauce, not pizza sauce.'
      - '**Sauce went brown and metallic after 4 days in fridge** Stored in a can, OR contaminated with garlic/onion residue, OR exposed to too much air. Always transfer to a glass or food-safe plastic container. Top with a thin layer of olive oil to prevent oxidation. Use within 3 days. Freeze the rest in ice cube trays.'
      - '**Added garlic and now sauce tastes harsh** Raw garlic in pizza sauce becomes harsh and bitter when exposed to acid, especially on a Margherita where it overpowers the basil. Don''t add garlic to pizza sauce. Use garlic confit oil (slow-cooked) drizzled on the finished pizza instead. Or build a [garlic confit white pizza](/recipes/garlic-confit-white) where garlic is the star.'
    tips:
      - '**Buy the right tomatoes once and never look back.** [Bianco DiNapoli](https://www.amazon.com/Bianco-DiNapoli-Crushed-Tomatoes-Pack/dp/B07Q2VG8RR) is the #1 pick. San Marzano DOP (look for the official seal) is excellent. Skip generic ''San Marzano-style'' tomatoes, they''re not the same.'
      - '**Crushed > whole peeled for pizza sauce.** Crushed tomatoes have the texture you want for pizza. Whole peeled need to be hand-crushed before using, which is fine but extra work. Pureed are too smooth, they get watery on the pizza.'
      - '**Salt by taste, not measurement.** 1 teaspoon per can is a starting point. Different brands have different salt levels in the can. Always taste after seasoning and adjust. Pizza sauce should taste slightly over-salted on its own, it gets diluted by the cheese and crust during baking.'
      - '**Skip the sugar.** Good tomatoes are naturally sweet. If your sauce tastes too acidic, you have cheap tomatoes, buy better ones next time. Don''t try to fix tomato quality with sugar.'
      - '**The herby variation works best with cheese-heavy pizzas.** Use it on plain cheese, pepperoni, white pies with a drizzle. For Margherita or pizzas with fresh basil on top, stick with the basic, let the fresh basil be the basil.'
      - '**Don''t simmer or reduce.** The sauce cooks on the pizza in the oven. Pre-cooking it dulls the bright flavor and turns it into pasta sauce. Cold-from-the-can is the move.'
      - '**Pulse the herbs gently.** If making the herby version, 3-5 quick pulses with an immersion blender. Over-blending breaks down the tomato cell walls and makes the sauce watery.'
      - '**It freezes great in ice cube trays.** Pour leftover sauce into ice cube trays, freeze, then transfer cubes to a freezer bag. 2 cubes = enough sauce for one pizza. Lasts 3+ months. Thaw in the fridge overnight before using.'
