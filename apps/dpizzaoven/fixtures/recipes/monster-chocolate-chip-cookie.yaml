    ingredients:
      - title: Ingredients
        items:
          - 490 g All Purpose Flour
          - 124 g Bread Flour
          - 8 oz unsalted brown butter (Kerrygold)
          - 4 oz unsalted butter chilled (Kerrygold)
          - 256 dark brown sugar
          - 236 g white sugar
          - 80 g heavy cream
          - 40 g dried whole milk powder
          - 10 g salt
          - 7 g espresso powder
          - 10 g baking powder
          - 5 g baking soda
          - 2 whole eggs
          - 1 egg yolk
          - 2 tsp vanilla extract
          - 300 g chopped bittersweet chocolate
          - 120 g chopped dark chocolate
          - 100 g chopped milk chocolate
          - flakey sea salt
    steps:
      - title: Brown 8oz of butter on medium high until the mil solids
        items:
          - Brown 8oz of butter on medium high until the mil solids just start to brown and the butter color turns a medium amber color. 8 oz unsalted brown butter (Kerrygold)
      - title: Then turn the heat to low and add the dried milk powder
        items:
          - 'Then turn the heat to low and add the dried milk powder. Keep on low heat, stirring occasionally, until the whole butter mixture turns a deep brown. 40 g dried whole milk powder'
          - '*You''ll know it''s right when:* Color should go from amber to deep mahogany brown but never black. If you see any black bits, you went too far. Aroma should be intensely nutty, almost like toasted caramel. The milk powder doubles the flavor depth.'
      - title: Turn the heat off and add your espresso powder into the
        items:
          - Turn the heat off and add your espresso powder into the brown butter mixture and stir.
      - title: 'Slowly add the heavy cream, little by little at a time'
        items:
          - 'Slowly add the heavy cream, little by little at a time. Whisk until incorporated until adding more.'
      - title: 'Once everything is mixed and combined, store in the fridge'
        items:
          - 'Once everything is mixed and combined, store in the fridge until the temperature of the mixture reaches 65 degrees.'
      - title: Pull out the rest of the butter from the fridge and leave
        items:
          - Pull out the rest of the butter from the fridge and leave on the counter so it can temper.
      - title: Weigh out all of your other ingredients and combine the
        items:
          - 'Weigh out all of your other ingredients and combine the flours, salt, baking powder and baking soda to a separate bowl. Mix and set aside.'
      - title: 'Next, finely chop all of your chocolates'
        items:
          - 'Next, finely chop all of your chocolates. Leave some of the bitter sweet chocolate in larger chunks and set aside. About half a cup. These will be used to put on top of each cookie.'
      - title: 'Once your browned butter is cooled, add your sugars'
        items:
          - 'Once your browned butter is cooled, add your sugars, vanilla extract and cubed butter into a mixer.'
      - title: Whip on medium speed until it smoothly comes together like
        items:
          - Whip on medium speed until it smoothly comes together like the picture.
      - title: 'Next, add your eggs and whip on high speed until it gets'
        items:
          - 'Next, add your eggs and whip on high speed until it gets fluffy and you devlope some stiff peaks in the mixture. Refer to picture.'
          - '*You''ll know it''s right when:* Mixture should at least double in volume, turn pale, and hold soft peaks on the whisk. About 5-7 minutes of whipping. If still glossy and smooth instead of fluffy, keep whipping; you want VOLUME here.'
      - title: Mix in the chocolate with a spatula to evenly distribute
        items:
          - Mix in the chocolate with a spatula to evenly distribute.
      - title: Add your flour mixture
        items:
          - Add your flour mixture. You can start with a spatula but it's easier to do by hand here.
      - title: Ball your cookie dough into 6 ounce chunks
        items:
          - 'Ball your cookie dough into 6 ounce chunks. Don''t ball them into a perfect ball, build them rustically and like a tower. Picture attached.'
      - title: Add large chunks on top
        items:
          - Add large chunks on top.
      - title: Cover in a tray and rest in the fridge for two days
        items:
          - Cover in a tray and rest in the fridge for two days.
      - title: Bake at 460 degrees convection setting for 7 minutes
        items:
          - Bake at 460 degrees convection setting for 7 minutes.
      - title: Pull out of the oven and top with flakey sea salt
        items:
          - Pull out of the oven and top with flakey sea salt.
      - title: Let rest on the pan for 90 minutes before digging in
        items:
          - Let rest on the pan for 90 minutes before digging in.
      - title: Enjoy!
        items:
          - Enjoy!
    notes:
      - 'This recipe is ~2.5 days of process for a stack of 12 cookies. That''s the trade. What you get in return is a cookie that''ll ruin most bakery cookies for you. Don''t try to shortcut the brown butter, the milk powder, the 2-day rest, or the 90-minute post-bake cool. Each one contributes something the others can''t.'
      - '**Cookies came out flat and crispy, not towering and tender** Brown butter wasn''t cooled to 65°F before mixing OR skipped the 2-day rest OR rolled into smooth balls instead of craggy towers. All three matter. Use a thermometer to verify 65°F butter. Full 2-day rest is non-negotiable. Stack dough into rustic towers, never smooth spheres. The combination is what creates the bakery look.'
      - '**Burned the brown butter** Heat too high OR walked away from the pan during the critical browning window. Medium heat MAX, and stand at the pan. Once milk solids turn medium amber and you smell nutty, pour IMMEDIATELY into a bowl. If you see any black bits or smell acrid burnt, throw it out and start over. There''s no fix.'
      - '**Interior was raw and gooey, not properly set** Skipped the 90-minute post-bake rest, OR cookies were under-baked. 90 minutes on the pan is mandatory. The cookies finish setting from residual heat. If interior is still wet at 90 min, bake them 1 more minute next time. If interior is dry, you over-baked.'
      - '**Chocolate distribution was uneven (some bites no chocolate)** Used chocolate chips instead of chopping bars by hand. Hand-chop three different chocolate bars with a chef''s knife into uneven pieces. The variation in size is what creates pools (large) and dispersed flavor (small). Chips are engineered NOT to do this.'
      - '**Mixed dough overnight instead of 2 days, results were okay but not amazing** Same-day or overnight dough doesn''t fully hydrate; flour gluten doesn''t have time to fully develop. 48 hours is the target for this specific recipe. The texture and flavor delta between 24 and 48 hours is significant. 72 hours showed diminishing returns in my testing.'
      - '**Cookies stuck together on the sheet pan** Placed too close together. These spread to ~5 inches diameter from a 3-inch tower. 4-6 cookies per half-sheet pan MAX. Plenty of space between. They''ll merge into one giant cookie if too close.'
      - '**Couldn''t find dried whole milk powder** Specialty pantry item, not at every grocery store. Amazon ships it (Bob''s Red Mill or NIDO brand). Don''t substitute with skim milk powder, the fat content matters. If absolutely can''t get it, increase brown butter intensity (browner) to partially compensate, but the cookies won''t be quite the same.'
      - '**Espresso powder made cookies taste like coffee** Used too much, OR used instant coffee instead of espresso powder. 7g espresso powder is correct, that''s about 1.5 tsp. It deepens chocolate flavor without being detectable as coffee. If you only have instant coffee, use 4g (less concentrated). Espresso powder is on Amazon, Medaglia D''Oro brand.'
