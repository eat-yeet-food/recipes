      ## Watch dough temperature

      Mixing builds gluten, but it also warms the dough. The temperature when mixing ends sets the pace for the rest of the recipe: warmer dough ferments sooner, while cooler dough gives you more time. The goal is to finish near the temperature the recipe expects, so the dough rises on schedule and keeps enough strength to shape and bake well.

      Check the final dough temperature as soon as mixing ends. Same-day yeast dough often lands around 75-78F. Next-day sourdough can land around 75-77F, but warmer dough gives you less margin before it gets ahead of its schedule. Several-day cold-proof pizza dough often benefits from a cooler finish around 71-72F. When dough finishes too warm, its first rise moves quickly and it can become slack, sticky, and difficult to shape sooner than the recipe suggests.

      Spiral mixers can add heat quickly through mixing friction. When a dough needs a cool final temperature, use very cold water or replace part of the mix water with crushed ice. Weigh the ice as part of the recipe's total water; it melts as you mix and absorbs some of that friction heat.

      Enriched dough often needs a longer final mix, so cool butter helps keep the dough from getting too warm while it develops. The butter still needs to be pliable enough to incorporate cleanly. To get both, place very cold butter between sheets of parchment and beat it with a rolling pin until it flexes without cracking. It can stay cold while becoming workable enough to add gradually, helping the dough reach full development without climbing too far above its target temperature.

