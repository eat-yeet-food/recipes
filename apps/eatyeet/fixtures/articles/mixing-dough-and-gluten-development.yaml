              ## Lean doughs

              Lean doughs are mostly flour, water, salt, and yeast or sourdough starter. The first goal is an even dough: no dry flour, salt and yeast or starter distributed through the bowl, and enough structure that the dough moves as one mass.

              From there, the goal depends on when the dough needs to be shaped. If it will be shaped soon, keep mixing or folding until it is smoother, more elastic, and strong enough for the recipe. If it will ferment for many hours, get folded during bulk, or cold proof for days, you can often stop earlier because time will keep hydrating the flour and organizing gluten.

              When salt is added at the beginning of the mix, the rough-to-smooth stage usually takes longer. Salt tightens the dough and slows hydration, so it will take the dough more work or time to develop.

              If you want the dough to stretch more easily with less mixing, combine only the flour and water, let that rough dough rest, then add the salt and yeast or starter afterward. This approach is called an autolyse. It can help tight dough relax, but it is not always useful: long-rest pizza has hydration time naturally built into a proofing step that spans days. King Arthur's [autolyse guide](https://www.kingarthurbaking.com/blog/2017/09/29/autolyse-sourdough) goes deeper.
