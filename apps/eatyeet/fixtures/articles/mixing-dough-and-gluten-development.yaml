  - type: callout
    tone: tip
    title: Watch dough temperature
    markdown: |
      Dough temperature matters because fermentation time, dough strength, and final texture depend on temperature through mixing, bulk fermentation, proofing, and cold holding. Warm dough moves faster; if it stays warm too long, proteolysis can weaken gluten and leave the dough slack, sticky, or hard to shape. Proteolysis means protein breakdown. A little helps dough relax and stretch, but too much breaks down the structure you were trying to build. King Arthur's sourdough acidity article explains the risk of [proteolytic activity and gluten degradation](https://www.kingarthurbaking.com/blog/2022/02/22/how-to-make-your-sourdough-bread-more-or-less-sour-part-3).

      Use final dough temperature as the main control point, not a rule by itself. Same-day yeast dough often lands around 75-78F. Next-day sourdough can land around 75-77F, but warmer dough gives you less margin. Several-day cold proof pizza dough often benefits from a cooler finish around 71-72F.

  - type: markdown
    markdown: |
      ## Methods at a Glance

      ### Hand mixing

      Hand mixing is best when you want to learn how dough changes under your hands, especially with sourdough or small batches. It adds very little friction heat, but it is slower and easier to underdo. Sticky doughs tempt you to add too much bench flour, stiff autolysed doughs can resist folding, and enriched doughs can be exhausting to develop fully by hand.

      ### Planetary mixer

      A planetary stand mixer is the common home-machine option and can handle many lean doughs and some enriched doughs. Its tradeoff is heat and strain: dough can climb the hook, smear against the bowl, or warm quickly at higher speed. Enriched dough may look broken before it comes together, so watch dough behavior instead of only watching the clock.

      ### Spiral mixer

      A spiral mixer develops gluten efficiently and is strong for pizza, bread, sourdough, and larger batches. It usually reaches a smooth, elastic dough faster than the other methods, which is the benefit and the risk. Check the dough sooner than you think, because it is easier to overshoot development when the mixer is doing the work quickly.
