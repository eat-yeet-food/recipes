      ## Methods at a Glance

      ### Hand mixing

      Hand mixing gives you the most direct way to track dough development, especially with sourdough or small batches. It adds very little friction heat, but it is slower and easier to underdo. Sticky doughs tempt you to add too much bench flour, stiff autolysed doughs can resist folding, and enriched doughs can be exhausting to develop fully by hand.

      ### Planetary mixer

      A planetary stand mixer is the common home-machine option and can handle many lean doughs and some enriched doughs. It often adds less heat than a spiral mixer, but its mixing action can be inefficient: dough can climb the hook, smear against the bowl, or rotate without getting stretched and worked consistently. That makes full gluten development, and a strong windowpane, difficult to achieve in many doughs. Stop to scrape the bowl and pull the dough down from the hook, then judge progress by the dough's smoothness and stretch rather than the clock alone.

      ### Spiral mixer

      A spiral mixer develops gluten efficiently and is strong for pizza, bread, sourdough, and larger batches. As the dough develops, look for a pumpkin shape: a single pleated mass gathered around the spiral and breaker bar at the center of the bowl. That shows the mixer is engaging the dough rather than simply dragging it around the bowl. It usually reaches the desired development faster than the other methods, which is the benefit and the risk. Use the pumpkin as a visual cue, then confirm the dough's stretch and temperature before deciding it is ready.
