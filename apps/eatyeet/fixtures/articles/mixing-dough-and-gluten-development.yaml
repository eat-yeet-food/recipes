    markdown: |
      ## Building Structure

      The goal of mixing is to turn flour, water, salt, and yeast or starter into dough that is even, elastic, and strong enough to hold fermentation gas. You are not just waiting for the ingredients to combine; you are building structure while keeping the dough manageable for the recipe you are making.

      Once mixing starts, the dough usually looks shaggy, sticky, and uneven. As water works into the flour and the ingredients spread through the bowl, it gathers into a cohesive mass. With mixing, folds, or rest, that rough mass smooths out and becomes more elastic, springing back when you press or stretch it. As gluten continues organizing, the dough also becomes more extensible, stretching thinner before it tears. The target is enough strength and stretch for the bread, pizza, or pastry you are making.

      Gluten is the network that makes that strength and stretch possible. Wheat flour contains glutenin and gliadin proteins; once they are hydrated, mixing and resting help them link into strands that run through the dough like a web. During fermentation, gas collects inside that web. If the web is too weak, the bubbles tear through it and the dough collapses. If it is strong but not extensible enough, the bubbles cannot expand and the dough resists rise and oven spring. By the end of mixing, the dough should be organized enough to hold gas and flexible enough to expand around it. King Arthur has a useful [beginner guide to gluten](https://www.kingarthurbaking.com/blog/2021/08/18/a-beginners-guide-to-gluten) if you want the longer version.

      Once you know how a recipe behaves, that understanding lets you adjust the method to fit your tools and preferences: more hand mixing, more rest, a shorter machine mix, or a different mixer speed, as long as the dough reaches the same structure.

