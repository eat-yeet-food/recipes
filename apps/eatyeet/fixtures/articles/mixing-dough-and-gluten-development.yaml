      ## Stages of Development

      Dry flour disappears first. At the beginning, the main job is getting water into the flour. Scrape the bowl and fold through the dough until there are no dry pockets left.

      The surface begins to smooth after the flour is hydrated. Rest, folding, and mixing all help. The dough should feel less like torn paste and more like a stretchy sheet.

      For many breads and enriched doughs, the goal before shaping is a strong enough gluten network to pass the windowpane test. Pinch off a small piece and gently stretch it. If it can get thin enough for light to pass through before tearing, the dough has enough structure to hold fermentation gas through shaping, proofing, and baking. King Arthur has a clear [windowpane walkthrough](https://www.kingarthurbaking.com/blog/2022/10/14/what-is-the-windowpane-test-for-bread-dough).

      A full windowpane is not necessary for every dough. Doughs that rest for many hours or cold proof over several days can start with a weaker windowpane because hydration, folds, and time continue organizing gluten while the dough rests. Doughs like Liege waffles also do not need the same strong, elastic sheet because they are enriched, pressed in a waffle iron, and should stay tender instead of developing like a tall loaf. Use the windowpane as evidence for recipes that need it, not as a rule for every mix.

