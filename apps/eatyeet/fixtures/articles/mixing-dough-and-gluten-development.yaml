      ## Terms worth knowing

      The windowpane test is a way to check gluten development. Pinch off a small piece of dough and gently stretch it; if it can get thin enough for light to pass through before tearing, the dough has a strong gluten network. King Arthur has a clear [windowpane walkthrough](https://www.kingarthurbaking.com/blog/2022/10/14/what-is-the-windowpane-test-for-bread-dough).

      A full windowpane is not always the early goal. Same-day sandwich bread or enriched dough often needs more development during mixing because it will be shaped soon. Doughs that rest for many hours or overnight can start with a weaker windowpane because hydration, folds, and time continue organizing gluten while the dough rests.

      Bulk fermentation is the first rise after mixing, before shaping. Proofing is the final rise after shaping. Hydration is the amount of water compared with flour, so a 70% hydration dough has 70g water for every 100g flour.

      A starter is a live sourdough culture used to ferment dough instead of, or alongside, commercial yeast. An autolyse is a rest after flour and water are mixed but before the final mix; it gives flour time to hydrate and can make dough easier to stretch. King Arthur's [autolyse guide](https://www.kingarthurbaking.com/blog/2017/09/29/autolyse-sourdough) goes deeper.

