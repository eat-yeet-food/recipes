blocks:
  - type: markdown
    markdown: |
      ## Choose your mixing method

      Mixing is not just combining flour and water. It hydrates flour, distributes salt and yeast or starter, organizes gluten, and changes dough temperature.

      A recipe can give timing, but the better target is dough behavior: cohesive, elastic, extensible, and strong enough for the style you are making. The method changes how quickly you get there and how much heat you add along the way.

