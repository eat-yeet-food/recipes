              ## Lean doughs

              Lean doughs are mostly flour, water, salt, and yeast or starter. They usually tolerate direct mixing well. Mix until the dough is cohesive, then decide whether the formula needs moderate or full gluten development.

              If you use an autolyse, low-hydration doughs can be tougher to finish by hand because the rested dough starts firm and resists folding. I would usually skip autolyse for pizza dough that will rest for a day or longer; that long rest already gives flour time to hydrate and gluten time to organize. Wet hands help, but a short machine mix may be more realistic for stiff bagel-style dough.

              Salt from the beginning also makes the rough-to-smooth stage take longer. It tightens the dough and slows hydration, so do not assume a rough surface means the mix has failed.
