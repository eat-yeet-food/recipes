              ## Enriched doughs

              Enriched doughs contain fat, sugar, eggs, milk, or butter. Fat can coat flour and slow gluten formation, so many doughs mix better when butter is delayed until the dough is already cohesive and elastic. Letting the dough rest for about 10 minutes before adding butter or other fat can also help gluten organize before the fat goes in. Butter should be pliable: cool, bendable, and able to incorporate without tearing the dough.

              Developing enriched dough fully by hand is possible, but it is a much longer and more demanding job once butter or a lot of sugar is involved. Work in short rounds of pressing, stretching, and folding with rests between them, rather than trying to knead it continuously. The finished dough should no longer look greasy or torn; it should feel smooth, elastic, and supple, hold together as a glossy mass, and stretch into a thin windowpane before it tears. This can take well over 30 minutes of active work, spread across those rests.

              A planetary mixer usually reaches that final stage in about 10 to 20 minutes after the butter is fully incorporated; a spiral mixer may take 5 to 10 minutes. Those are starting ranges, not a target to chase. In either mixer, stop to scrape the bowl and pull the dough down from the hook when needed, then check for a smooth, elastic windowpane. A planetary mixer can make the dough climb the hook, smear against the bowl, and warm quickly. A spiral works faster, so check sooner and more often once the dough starts looking cohesive.
