    markdown: |
      ## Choose your mixing method

      Mixing is not just combining flour and water. It hydrates flour, distributes salt and yeast or starter, organizes gluten, and changes dough temperature. Dough temperature matters because it controls how fast fermentation moves from this point forward: warmer dough rises faster, chills more slowly, and gives you less margin before the dough becomes over-fermented or weak.

      Gluten is the stretchy protein network that helps dough trap fermentation gas and hold its shape; King Arthur has a useful [beginner guide to gluten](https://www.kingarthurbaking.com/blog/2021/08/18/a-beginners-guide-to-gluten) if you want the longer version. A recipe can give timing, but the better target is dough behavior: cohesive, elastic, extensible, and strong enough for the style you are making. Elastic means the dough springs back; extensible means it can stretch without tearing right away.

      The method changes how quickly you reach that behavior and how much friction heat you add while mixing. Friction heat is heat created by kneading or machine mixing; it is one reason a dough can leave the mixer warmer than the water you started with.

