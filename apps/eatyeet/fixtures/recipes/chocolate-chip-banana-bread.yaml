blocks:
  - type: recipe
    equipment: []
    ingredients:
      - title: ''
        items:
          - id: ingredients-1-item-1
            text: '60g European-style unsalted butter, browned and cooled'
          - id: ingredients-1-item-2
            text: 425g mashed bananas
          - id: ingredients-1-item-3
            text: 200g brown sugar
          - id: ingredients-1-item-4
            text: 120g sour cream
          - id: ingredients-1-item-5
            text: 1 large egg
          - id: ingredients-1-item-6
            text: 60g canola oil
          - id: ingredients-1-item-7
            text: 40g milk
          - id: ingredients-1-item-8
            text: 5g vanilla bean paste or extract
          - id: ingredients-1-item-9
            text: 250g cake flour
          - id: ingredients-1-item-10
            text: 1 tsp baking soda
          - id: ingredients-1-item-11
            text: ¾ tsp baking powder
          - id: ingredients-1-item-12
            text: 4g fine sea salt
          - id: ingredients-1-item-13
            text: '250g dark chocolate, chopped'
        id: ingredients-1
    steps:
      - title: ''
        items:
          - id: steps-1-item-1
            text: >-
              Preheat the oven to 350°F. Grease and line a standard 9x5-inch loaf pan with parchment paper, leaving
              overhang on the long sides.
          - id: steps-1-item-2
            text: >-
              Brown the butter: Melt the butter in a small saucepan over medium heat, stirring often, until the milk
              solids turn golden and it smells nutty — about 5 minutes. Pour into a small bowl and let cool below 140°F
              while you mix the rest. The other ingredients can go in straight from the fridge.
          - id: steps-1-item-3
            text: >-
              Whisk the dry ingredients: In a medium bowl, whisk together the cake flour, baking soda, baking powder,
              and fine sea salt.
          - id: steps-1-item-4
            text: >-
              Start the wet mixture: In a large bowl, whisk the sour cream, egg, canola oil, milk, and vanilla until
              smooth. Whisk in the brown sugar.
          - id: steps-1-item-10
            text: >-
              Add the butter and bananas: Once the brown butter is below 140°F, whisk it in. Then mix in the mashed
              bananas until fully combined.
          - id: steps-1-item-11
            text: >-
              Check the temperature: If the batter is below 70°F, microwave it in 10-second bursts, stirring and
              checking with an IR thermometer each time, until it reaches 70°F.
          - id: steps-1-item-5
            text: >-
              Combine: Add the dry ingredients to the wet ingredients and fold gently with a spatula until just
              combined. The batter should stay a little lumpy; do not overmix.
          - id: steps-1-item-6
            text: Fold in the chopped dark chocolate just until evenly distributed.
          - id: steps-1-item-7
            text: Transfer the batter to the prepared loaf pan and smooth the top.
          - id: steps-1-item-8
            text: >-
              Bake on the middle rack at 350°F for 60-70 minutes, until the loaf is deeply golden and the center
              registers 200°F on an instant-read thermometer. Start checking around 50 minutes and tent loosely with
              foil if the top is browning too quickly.
          - id: steps-1-item-9
            text: 'Cool in the pan for 10-15 minutes, then transfer to a wire rack to finish cooling before slicing.'
        id: steps-1
    notes: []
    tips:
      - Use very ripe bananas for the strongest banana flavor and the softest crumb.
      - Pull the loaf at 200°F internal if you want the center to stay gooey without turning raw.
      - Thawed frozen bananas work here too.
