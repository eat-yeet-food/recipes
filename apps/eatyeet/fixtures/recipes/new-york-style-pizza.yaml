    ingredients:
      - id: dough
        title: Dough
        items:
          - id: dough-item-1
            text: >-
              861g [Kirkland Organic All-Purpose
              Flour](https://www.costco.com/p/-/kirkland-signature-organic-unbleached-all-purpose-flour-10-lbs-2-count/4000063331.)
          - id: dough-item-2
            text: 560g cold water
          - id: dough-item-3
            text: '2.15g [SAF gold instant yeast](https://a.co/d/j9mxG9d)'
          - id: dough-item-4
            text: 17.2g fine sea salt
      - id: sauce-batch
        title: Pizza Sauce
        items:
          - id: sauce-batch-item-1
            text: 1 can Bianco di Napoli whole peeled tomatoes
      - id: pizza-toppings
        title: Pizza
        items:
          - id: pizza-sauce
            text: pizza sauce
          - id: mozzarella
            text: >-
              shredded [Trader Joe's whole milk low moisture
              mozzarella](https://www.traderjoes.com/home/search?q=whole%20milk%20low%20moisture%20mozzarella&section=products)
          - id: pecorino
            text: pecorino romano
          - id: pizza-toppings-item-4
            text: >-
              [Olive
              oil](https://www.amazon.com/Graza-Sizzle-Extra-Virgin-Olive-Oil-Cooking-High-Polyphenol/dp/B09WV8DBPV/ref=asc_df_B09WV8DBPV?mcid=70ed972e0350313daddca3d5ee42bc1a&tag=hyprod-20&linkCode=df0&hvadid=693367302614&hvpos&hvnetw=g&hvrand=17371064147806287911&hvpone&hvptwo&hvqmt&hvdev=c&hvdvcmdl&hvlocint&hvlocphy=9009731&hvtargid=pla-2006470262336&psc=1&hvocijid=17371064147806287911-B09WV8DBPV-&hvexpln=0)
          - id: pizza-toppings-item-5
            text: >-
              50g [Semolina
              flour](https://shop.kingarthurbaking.com/items/semolina-flour?utm_source=google&utm_medium=cpc&utm_term&utm_content=adtaxi&gad_source=1&gad_campaignid=22480904075&gbraid=0AAAAADiGhPK4w0ymJ2ZHxouS0qcChO-7Y&gclid=CjwKCAjwmenCBhA4EiwAtVjzmibHOPT_R4uMvXe44GRfVd6KqCijZEJnd1ENYHCiJnd1_Hctc8QaOBoC_80QAvD_BwE)
              + 50g [all purpose
              flour](https://www.wholefoodsmarket.com/product/365-by-whole-foods-market-all-purpose-flour-80-oz-b074jd6hhh)
              for dusting
          - id: oregano
            text: dried oregano
    steps:
      - title: Dough
        items:
          - id: steps-1-item-1
            text: >-
              Fill a pitcher with water and ice and let it chill down. Weigh out the water only — keep the ice out of
              the mixer bowl.
          - id: combine-dough
            text: 'Add the {{mixingIngredients}} to the spiral mixer all at once.'
          - id: steps-1-item-3
            text: >-
              Mix at 40% speed until the dough reads 72°F on your IR thermometer. Scrape the bowl and hook down with
              your bench scraper if dough climbs.
          - id: steps-1-item-4
            text: >-
              Transfer the dough to your bench. Knead shortly, guide dough with bench scraper into the form of a ball,
              place in a bowl, cover with saran wrap, and allow it to rest at room temperature for 1.5h.
          - id: divide-dough
            text: "Divide and shape dough into {{pieceCount}} {{pieceLabelPlural}}, shooting for {{pieceWeightGrams}} each ({{totalDoughGrams}} total dough). Pull four times in gentle circles on your unfloured bench until smooth on the top. Pinch any bottom seam that remains. Circular dough balls make circular pizzas \U0001F642 ([video](https://www.youtube.com/watch?v=Vo5OW8Xkah4&t=9s))."
          - id: steps-1-item-6
            text: >-
              Grease your proofing container with canola oil. Transfer the dough to the container with your bench
              scraper. After placing in a proofing container, lightly oil your hands and gently rub the top of the dough
              to make it less sticky and retain moisture. Cover and place in the refrigerator for 2-3 days.
        id: steps-1
      - title: Pre-Assembly
        items:
          - id: steps-2-item-1
            text: >-
              Pizza sauce: Drain off ¼ cup of water from the can, then hand crush or mill the tomatoes to a smooth,
              easy-to-spread consistency. Place sauce in a small bowl and cover with saran wrap. It's ok to freeze /
              refrigerate for a bit, but always bring to room temperature immediately before use to avoid gummy pizza.
          - id: steps-2-item-2
            text: 'Cheese: Grate the mozzarella and finely grate the romano.'
          - id: steps-2-item-3
            text: 'Bench flour: Mix 50/50 semolina + all purpose flour in a small bowl and set aside.'
        id: steps-2
      - title: Pizza Assembly
        items:
          - id: steps-3-item-1
            text: 'The day you plan to bake, remove dough from the refrigerator and allow the dough to rest for 2 hours.'
          - id: steps-3-item-2
            text: 'Preheat your oven on low for 30 minutes with rotation activated, then begin prepping the pizza.'
          - id: steps-3-item-3
            text: Lightly dust your wooden peel with bench flour.
          - id: steps-3-item-4
            text: Remove dough with your bench scraper and cover liberally with bench flour.
          - id: steps-3-item-5
            text: 'Stretch dough to {{pizzaDiameter}} ([video](https://www.youtube.com/watch?v=Entzcl8q7H4)).'
          - id: steps-3-item-6
            text: Place the dough on the peel with the rough bottom side facing up.
          - id: steps-3-item-7
            text: >-
              Apply sauce to the pizza in a circular motion with a large spoon all the way to the raised portion that
              will become your crust.
          - id: steps-3-item-8
            text: Pinch dried oregano in your fingers to oxidize and spread over the top of the sauce.
          - id: steps-3-item-9
            text: 'Spread Romano cheese evenly over the entire pizza, covering as much of the sauce as possible.'
          - id: steps-3-item-10
            text: Scatter the shredded mozzarella evenly over the top.
        id: steps-3
      - title: Launch / Bake
        items:
          - id: steps-4-item-1
            text: >-
              Once the pizza is built, turn the oven off. Wait until the center of the stone reads 630°F on your IR
              thermometer.
          - id: steps-4-item-2
            text: >-
              Turn the oven back on to medium with rotation off and launch the pizza in the center of the stone. Turn
              rotation back off.
          - id: steps-4-item-3
            text: >-
              Bake for 5-6 minutes, rotating frequently. If the bottom is running ahead of the top, slide the pizza onto
              a screen just before the bottom reaches the doneness you want and finish the bake on the screen.
          - id: steps-4-item-4
            text: Remove the pizza from the oven with your large metal peel and place on a wire rack.
          - id: steps-4-item-5
            text: 'Transfer the pizza to a cutting board, slice, and return to the wire rack to keep crispy.'
          - id: steps-4-item-6
            text: Serve hot.
        id: steps-4
    notes:
      - >-
        This dough formula uses Kirkland Organic All-Purpose Flour at 65% hydration and lands around 1,440g total dough,
        or about 480g per dough ball.
      - >-
        Trader Joe's whole milk low moisture mozzarella is a particularly good choice for this pizza. If the shredded
        cheese clumps or is difficult to distribute, freeze it briefly after shredding; this can help the strands
        separate.
      - >-
        Olive oil and sugar have been withheld from this recipe due to high temperatures of the pizza oven to prevent
        burning. These are often employed in lower temperature ovens to improve browning.
      - 'Great [article](https://www.richardeaglespoon.com/articles/how-to-pizza) with a lot info.'
      - >-
        Good [video](https://www.youtube.com/watch?v=TQYApZ_-P24) with more info, not always reliable but pretty
        informative.
      - 'Lots of info in [r/Pizza](https://www.reddit.com/r/Pizza/) from the community.'
      - >-
        I recommend making a couple more balls than you plan to eat to start. It will take 5 bakes to settle in and
        making more each time will shorten the learning curve.
    tips:
      - >-
        If launching is tricky, build the pizza on parchment on your peel. Launch with the parchment, then slide it out
        after 1 minute.
