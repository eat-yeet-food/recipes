        ingredients:
          - title: Dough
            items:
              - '852g [Costco all-purpose flour](https://www.costco.com/p/-/kirkland-signature-organic-unbleached-all-purpose-flour-10-lbs-2-count/4000063331.)'
              - 554g cold water
              - 17g canola oil
              - '3/4 tsp [SAF red instant yeast](https://www.amazon.com/LeSaffre-LEAVENING_AGENT/dp/B0CFDPMWWC)'
              - '17g [Diamond Crystal Baking Salt](https://www.amazon.com/Diamond-Crystal-Baking-Kosher-8-5oz/dp/B0CHVLXM7R/) or fine sea salt'
          - title: Pizza Sauce
            items:
              - 1 can Bianco di Napoli whole peeled tomatoes
          - title: Pizza
            items:
              - 6 oz pizza sauce
              - '6 oz shredded [mild provolone cheese](https://www.instacart.com/products/379755-belgioioso-provolone-cheese-mild-half-moon-wedge-8-oz?retailer_id=264&product_id=379755&region_id=9250594479&utm_medium=sem_shopping&utm_source=instacart_google&utm_campaign=ad_demand_shopping_lia_food_all-non-ca_evergreen&utm_content=accountid-8145171519_campaignid-19906608628_adgroupid-147863115739_device-c&utm_term=targetid-aud-1930465835203:pla-849568637689_locationid-9009731_adtype-pla_productchannel-local_merchantid-178347373_storecode-9250594479_productid-379755&gad_source=4&gad_campaignid=19906608628&gbraid=0AAAAADO98hacyUWxP7Sr6fRNqs-3bZG4k&gclid=CjwKCAjwmenCBhA4EiwAtVjzmtlNEoXkllue7BmUZWpFqtxW9C6dbkrOQP2dDQ86WH7LaS3vaeAu6BoCZMEQAvD_BwE), frozen'
              - 20g pecorino romano
              - '[Olive oil](https://www.amazon.com/Graza-Sizzle-Extra-Virgin-Olive-Oil-Cooking-High-Polyphenol/dp/B09WV8DBPV/ref=asc_df_B09WV8DBPV?mcid=70ed972e0350313daddca3d5ee42bc1a&tag=hyprod-20&linkCode=df0&hvadid=693367302614&hvpos&hvnetw=g&hvrand=17371064147806287911&hvpone&hvptwo&hvqmt&hvdev=c&hvdvcmdl&hvlocint&hvlocphy=9009731&hvtargid=pla-2006470262336&psc=1&hvocijid=17371064147806287911-B09WV8DBPV-&hvexpln=0)'
              - '50g [Semolina flour](https://shop.kingarthurbaking.com/items/semolina-flour?utm_source=google&utm_medium=cpc&utm_term&utm_content=adtaxi&gad_source=1&gad_campaignid=22480904075&gbraid=0AAAAADiGhPK4w0ymJ2ZHxouS0qcChO-7Y&gclid=CjwKCAjwmenCBhA4EiwAtVjzmibHOPT_R4uMvXe44GRfVd6KqCijZEJnd1ENYHCiJnd1_Hctc8QaOBoC_80QAvD_BwE) + 50g [all purpose flour](https://www.wholefoodsmarket.com/product/365-by-whole-foods-market-all-purpose-flour-80-oz-b074jd6hhh) for dusting'
              - 1/4 tsp dried oregano
        steps:
          - title: Dough
            items:
              - Fill a pitcher with water and ice and let it chill down. Weigh out the water only; keep the ice out of the mixer bowl.
              - Add the water, flour, canola oil, salt, and yeast to the spiral mixer all at once.
              - Mix at 40% speed until the dough reads 72F on your IR thermometer. Scrape the bowl and hook down with your bench scraper if dough climbs.
              - Transfer the dough to your bench. Knead shortly, guide dough with bench scraper into the form of a ball, place in a bowl, cover with saran wrap, and allow it to rest at room temperature for 1.5h.
              - Divide and shape dough into 3 balls, shooting for about 480g each. The formula lands around 1,440g total dough after salt, oil, and yeast. Pull four times in gentle circles on your unfloured bench until smooth on the top. Pinch any bottom seam that remains.
              - Grease your proofing container with canola oil. Transfer the dough to the container with your bench scraper. After placing in a proofing container, lightly oil your hands and gently rub the top of the dough to make it less sticky and retain moisture. Cover and place in the refrigerator for 2-3 days.
          - title: Pre-Assembly
            items:
              - 'Pizza sauce: Drain off 1/4 cup of water from the can, then hand crush or mill the tomatoes to a smooth, easy-to-spread consistency. If desired, stir in 1 minced garlic clove just before using the sauce; if making only one pizza, use 1/4 minced garlic clove. Place sauce in a small bowl and cover with saran wrap. It is ok to freeze / refrigerate for a bit, but always bring to room temperature immediately before use to avoid gummy pizza.'
              - 'Cheese: Grate provolone cheese in the rotary blender, place in a large sandwich bag and freeze at least 1 hour prior to baking. Grate romano cheese with a fine rotary grater and place in another small bowl.'
              - 'Bench flour: Mix 50/50 semolina + all purpose flour in a small bowl and set aside.'
          - title: Pizza Assembly
            items:
              - The day you plan to bake, remove dough from the refrigerator and allow the dough to rest for 2 hours.
              - Place the baking steel on the top rack and preheat the oven at its highest setting, ideally 550F, for at least 1 hour.
              - Place a parchment circle on your wooden peel.
              - Remove dough with your bench scraper and cover liberally with bench flour.
              - Stretch dough to 16".
              - Place the dough on the parchment with the rough bottom side facing up.
              - Apply sauce to the pizza in a circular motion with a large spoon all the way to the raised portion that will become your crust.
              - Pinch dried oregano in your fingers to oxidize and spread over the top of the sauce.
              - Spread Romano cheese evenly over the entire pizza, covering as much of the sauce as possible.
              - Scatter the frozen shredded provolone evenly over the top, straight from the freezer.
          - title: Launch / Bake
            items:
              - Launch the pizza, still on the parchment, directly onto the baking steel.
              - After 2 minutes, slide your peel under the edge of the pizza and pull the parchment out.
              - Bake 4-5 minutes more, rotating once or twice, until the bottom is crisp and the cheese is melted.
              - If the top needs more color after the bottom is done, switch to broil for 30-60 seconds and watch closely.
              - Remove the pizza from the oven with your peel and place on a wire rack.
              - Transfer the pizza to a cutting board, slice, and return to the wire rack to keep crispy.
              - Serve hot.
        notes:
          - This dough formula uses Costco all-purpose flour at 65% hydration with 2% canola oil and lands around 1,440g total dough, or about 480g per dough ball.
          - The canola oil is here because this version bakes at home-oven temperatures. It helps browning and tenderness on a baking steel.
          - Great [article](https://www.richardeaglespoon.com/articles/how-to-pizza) with a lot info.
          - Good [video](https://www.youtube.com/watch?v=TQYApZ_-P24) with more info, not always reliable but pretty informative.
          - Lots of info in [r/Pizza](https://www.reddit.com/r/Pizza/) from the community.
          - I recommend making a couple more balls than you plan to eat to start. It will take 5 bakes to settle in and making more each time will shorten the learning curve.
        tips: []
