slug: pollo-asado
title: Pollo Asado
order: 1
description: >-
  Smoky chicken thighs marinated in chipotle adobo, garlic, and rice bran oil. The sauce coats every piece generously,
  and a finishing salt dust seasons the char straight off the grill.
category: savory
prepMinutes: 30
cookMinutes: 15
totalMinutes: 525
yieldAmount: 4
yieldUnit: servings
image: pollo-asado.jpg
courses:
