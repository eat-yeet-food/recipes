slug: pollo-asado
title: Pollo Asado
order: 1
description: 'Smoky chicken thighs marinated in a double batch of chipotle adobo, garlic, and rice bran oil. The extra sauce coats every piece generously, and a finishing salt dust seasons the char straight off the grill.'
category: savory
prepMinutes: 30
cookMinutes: 15
totalMinutes: 525
yieldAmount: 4
yieldUnit: servings
image: pollo-asado.jpg
courses:
  - mains
cuisines:
  - central_american
methods:
  - grilling
restrictions: []
occasions:
  - entertaining
  - everyday
ingredientTypes:
  - chicken
created: '2026-05-01'
blocks:
  - type: recipe
    equipment: []
    ingredients:
      - title: ''
        items:
          - '4 [chipotle peppers in adobo sauce](https://www.amazon.com/s?k=chipotles+in+adobo+sauce), from the can'
          - '8 garlic cloves, peeled and trimmed'
          - 6 tbsp rice bran oil (or any neutral oil)
          - '1 tbsp salt, plus more for dusting after grilling'
          - 3 lb boneless skinless chicken thighs
    steps:
      - title: ''
        items:
          - 'Blend the marinade: Add the chipotle peppers in adobo, garlic, rice bran oil, and salt to a blender. Blend until smooth, about 30 seconds, scraping down as needed. The sauce should be thick, smoky, and glossy.'
          - 'Marinate the chicken: Place the chicken thighs in a zip-top bag or shallow dish. Pour the marinade over and massage to coat every piece. Refrigerate overnight (8-24 hours).'
          - 'Bring to room temp: Pull the chicken from the fridge 20-30 minutes before cooking so it cooks evenly.'
          - 'Cook the chicken: Grill over the hottest part of the grill at 500-525°F. About 5 minutes per side until 175°F internal — the adobo-rich sauce will char and bloom but won''t burn the way a sugar-loaded marinade would.'
          - 'Rest, dust, and serve: Let the thighs rest 5 minutes, then dust with flaky or kosher salt while still hot so it sticks to the char. Slice and serve with rice, charred tortillas, slaw, or pickled onions.'
    notes:
      - Save the leftover chipotle peppers in adobo in a small container in the fridge or freeze in tablespoon portions.
    tips:
      - Save the extra adobo sauce from the can and spoon a little over the chicken after slicing if you want more smoke and heat.
