blocks:
  - type: recipe
    equipment:
      - title: ''
        items:
          - id: equipment-adobo-saucepan
            text: Small saucepan with lid
          - id: equipment-blender
            text: Blender
        id: equipment-1
    ingredients:
      - title: Marinade (makes enough for 2 batches)
        items:
          - id: adobo-chipotles
            text: 56g dried chipotle morita peppers (about 16)
          - id: adobo-boiling-water
            text: Boiling water, for soaking
          - id: adobo-water
            text: 90g fresh water
          - id: adobo-onion
            text: ½ medium onion (about 75g), finely minced
          - id: adobo-vinegar
            text: 75g white vinegar
          - id: ingredients-1-item-8
            text: 2 tbsp white wine vinegar
          - id: adobo-tomato-paste
            text: 5 oz (142g) tomato paste
          - id: ingredients-1-item-5
            text: 120g rice bran oil (or any neutral oil)
          - id: adobo-salt
            text: 1 tsp kosher salt
          - id: ingredients-1-item-6
            text: 4g salt
        id: ingredients-adobo
      - title: Chicken
        items:
          - id: ingredients-1-item-1
            text: Half the marinade
          - id: ingredients-1-item-7
            text: 3 lb boneless skinless chicken thighs
          - id: dusting-salt
            text: Flaky or kosher salt, for dusting after grilling
        id: ingredients-1
    steps:
      - title: Marinade
        items:
          - id: adobo-soak
            text: '**Soak:** Cover the chipotles with boiling water and soak 30–45 minutes.'
          - id: adobo-drain
            text: '**Drain:** Drain, discard the soaking water, and remove the stems.'
          - id: adobo-onion-step
            text: '**Soften the onion:** Sauté the onion in a spoonful of the oil for 3–4 minutes, until soft.'
          - id: adobo-combine
            text: >-
              **Combine:** Add the chipotles, fresh water, both vinegars, tomato paste, the rest of the oil, and both
              salts.
          - id: adobo-simmer
            text: '**Simmer:** Cover and gently simmer 20–30 minutes, adding a tablespoon of water if needed.'
          - id: adobo-reduce
            text: '**Reduce:** Simmer uncovered briefly until thick and saucy, then cool slightly.'
          - id: steps-1-item-1
            text: >-
              **Blend:** Blend until smooth, about 30 seconds, scraping down as needed. The sauce should be thick,
              smoky, and glossy. Set aside half for this batch and refrigerate or freeze the rest for the next one.
        id: steps-adobo
      - title: Chicken
        items:
          - id: steps-1-item-2
            text: >-
              Marinate the chicken: Place the chicken thighs in a zip-top bag or shallow dish. Pour half the marinade
              over and massage to coat every piece. Refrigerate overnight (8-24 hours).
          - id: steps-1-item-3
            text: 'Bring to room temp: Pull the chicken from the fridge 20-30 minutes before cooking so it cooks evenly.'
          - id: steps-1-item-4
            text: >-
              Cook the chicken: Grill over the hottest part of the grill at 500-525°F. About 5 minutes per side until
              175°F internal — the adobo-rich sauce will char and bloom but won't burn the way a sugar-loaded marinade
              would.
          - id: steps-1-item-5
            text: >-
              Rest, dust, and serve: Let the thighs rest 5 minutes, then dust with flaky or kosher salt while still hot
              so it sticks to the char. Slice and serve with rice, charred tortillas, slaw, or pickled onions.
        id: steps-1
    notes: []
    tips:
      - 'The saved half keeps up to a week in the fridge or a few months frozen. Next time, skip straight to marinating.'
