blocks:
  - type: recipe
    equipment: []
    ingredients:
      - title: Cookie dough
        items:
          - id: dough-flour
            text: 390g all-purpose flour
          - id: dough-powdered-sugar
            text: 279g powdered sugar
          - id: dough-granulated-sugar
            text: 20g granulated sugar
          - id: dough-butter
            text: 130g unsalted butter, softened
          - id: dough-oil
            text: 53g canola oil
          - id: dough-egg
            text: 45g beaten whole egg
          - id: dough-salt
            text: ½ tsp fine salt
          - id: dough-baking-soda
            text: ¼ tsp baking soda
          - id: dough-cream-of-tartar
            text: ½ tsp cream of tartar
          - id: dough-almond
            text: ⅛ tsp almond extract
        id: dough
      - title: Pink almond-vanilla buttercream
        items:
          - id: frosting-butter
            text: 138g unsalted butter (65–68°F)
          - id: frosting-powdered-sugar
            text: 276g powdered sugar, sifted
          - id: frosting-cream
            text: 18g heavy whipping cream (about 1 tbsp + ½ tsp)
          - id: frosting-vanilla
            text: 1¾ tsp pure vanilla extract
          - id: frosting-almond
            text: ⅛ tsp almond extract
          - id: frosting-salt
            text: Tiny pinch of fine sea salt
          - id: frosting-color
            text: Pink gel food coloring, as needed
        id: frosting
    steps:
      - title: Cookies
        items:
          - id: preheat
            text: Preheat the oven to 325°F (165°C). Line two baking sheets with parchment paper.
          - id: cream
            text: >-
              In a stand mixer fitted with the paddle attachment, beat the softened butter, powdered sugar and
              granulated sugar on low-medium speed for 1–2 minutes, until smooth and creamy. Avoid whipping excess air
              into the dough.
          - id: oil-egg
            text: >-
              Add the canola oil, beaten egg and almond extract. Mix on low until fully combined, scraping the bowl as
              needed.
          - id: dry
            text: >-
              In a separate bowl, whisk together the flour, salt, baking soda and cream of tartar. Add to the wet
              ingredients in two additions, mixing on low just until no dry flour remains.
          - id: shape
            text: >-
              Divide the dough into 8 equal portions, about 115g each. Shape into thick disks about 3½ inches wide.
              Chill for 30–45 minutes.
          - id: bake
            text: >-
              Bake for 13–15 minutes, until the edges are just set and the tops and bottoms are still pale. Pull them
              when they look very slightly underbaked; the centers finish setting on the hot sheet. Cool on the baking sheet for 10 minutes, then move to a rack and cool completely.
        id: steps
      - title: Frosting and assembly
        items:
          - id: whip-butter
            text: >-
              Fit a stand mixer with the paddle attachment and add the butter at 65–68°F. Start on low, then increase
              to medium-high and whip for about 3 minutes until light, smooth and fluffy. Scrape down the sides and
              bottom of the bowl.
          - id: add-sugar
            text: >-
              Reduce the mixer to low. Add the sifted powdered sugar in three additions, mixing until incorporated
              after each. Scrape down the bowl each time.
          - id: flavor
            text: >-
              Add the heavy cream, vanilla, almond extract, salt and a small amount of pink gel coloring. Mix on low
              until combined.
          - id: final-whip
            text: >-
              Increase to high speed and whip for 1 minute until smooth, fluffy and fully combined. The frosting should
              spread easily while holding a thick swirl.
          - id: frost
            text: >-
              Once the cookies are completely cool, spread about 55g of frosting on each, leaving a narrow border
              around the edges. Refrigerate the finished cookies for at least 1 hour before serving.
        id: frosting-steps
    notes:
      - An experimental copycat, not an official Crumbl recipe.
    tips: []
