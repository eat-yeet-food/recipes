blocks:
  - type: recipe
    equipment: []
    ingredients:
      - title: Cookie dough
        items:
          - id: dough-flour
            text: 425g all-purpose flour (about 3½ cups)
          - id: dough-powdered-sugar
            text: 180g powdered sugar (about 1½ cups)
          - id: dough-granulated-sugar
            text: 116g granulated sugar (about ½ cup + 1½ tbsp)
          - id: dough-butter
            text: 180g unsalted butter, softened (about ¾ cup + 1 tbsp)
          - id: dough-oil
            text: 65g canola oil (about ¼ cup + 1 tsp)
          - id: dough-egg
            text: 45g beaten whole egg (slightly less than 1 large egg)
          - id: dough-baking-soda
            text: ½ tsp baking soda
          - id: dough-cream-of-tartar
            text: ½ tsp cream of tartar
          - id: dough-salt
            text: ⅓ tsp fine salt
          - id: dough-almond
            text: ⅛ tsp almond extract
        id: dough
      - title: Pink almond frosting
        items:
          - id: frosting-powdered-sugar
            text: 276g powdered sugar (about 2¼ cups)
          - id: frosting-butter
            text: 55g unsalted butter, softened (about 4 tbsp)
          - id: frosting-cream
            text: 45g heavy cream (3 tbsp)
          - id: frosting-almond
            text: ⅛ tsp almond extract
          - id: frosting-color
            text: A few drops pink food coloring
        id: frosting
    steps:
      - title: ''
        items:
          - id: cream
            text: Cream the softened butter, powdered sugar and granulated sugar until smooth and fluffy, about 2 minutes.
          - id: oil-egg
            text: Slowly blend in the canola oil. Add the beaten egg and almond extract; mix until incorporated.
          - id: dry
            text: >-
              In a separate bowl, whisk the flour, baking soda, cream of tartar and salt. Mix into the wet ingredients
              just until a soft dough forms.
          - id: shape
            text: Divide into 8 equal portions (about 125g each). Shape into thick, flat disks, about 3½–4 inches wide.
          - id: chill
            text: Refrigerate the shaped dough for 30 minutes. Preheat the oven to 350°F (175°C).
          - id: bake
            text: >-
              Bake on parchment-lined sheets for 11–15 minutes, until the tops look set but the cookies remain pale.
              Cool completely.
          - id: frosting
            text: >-
              For the frosting, beat the softened butter until creamy. Gradually beat in the powdered sugar, heavy
              cream, almond extract and pink coloring until smooth.
          - id: frost
            text: Spread the frosting generously over the cooled cookies. Chill at least 1 hour before serving.
        id: steps
    notes:
      - An experimental copycat, not an official Crumbl recipe.
    tips: []
