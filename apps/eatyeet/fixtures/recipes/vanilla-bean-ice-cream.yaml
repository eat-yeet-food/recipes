blocks:
  - type: recipe
    equipment:
      - title: ''
        items:
          - id: equipment-1-item-1
            text: Cuisinart ice cream maker (bowl frozen solid)
          - id: equipment-1-item-2
            text: Instant-read thermometer
          - id: equipment-1-item-3
            text: Saucepan
          - id: equipment-1-item-4
            text: Covered freezer container
        id: equipment-1
    ingredients:
      - title: ''
        items:
          - id: ingredients-1-item-1
            text: 476g heavy whipping cream
          - id: ingredients-1-item-2
            text: 305g skim milk
          - id: ingredients-1-item-3
            text: 170g granulated sugar
          - id: ingredients-1-item-4
            text: 32g egg yolk
          - id: ingredients-1-item-7
            text: 1 tbsp vanilla bean paste
        id: ingredients-1
    steps:
      - title: ''
        items:
          - id: steps-1-item-1
            text: >-
              **Combine:** Combine the cream, skim milk, sugar, and egg yolk in a saucepan. Whisk thoroughly.
          - id: steps-1-item-3
            text: >-
              **Cook to 168°F:** Heat gently, stirring constantly. Remove from heat at 168°F (76°C). Do not boil or
              reduce.
          - id: steps-1-item-4
            text: '**Add the vanilla:** Stir in the vanilla bean paste immediately after removing from the heat.'
          - id: steps-1-item-5
            text: '**Chill:** Cool quickly in an ice-water bath. Cover and refrigerate 4–24 hours.'
          - id: steps-1-item-6
            text: '**Churn:** Churn in a completely frozen Cuisinart bowl until thick, dense soft serve.'
          - id: steps-1-item-7
            text: '**Freeze:** Transfer to a covered container and freeze 4–6 hours or overnight.'
        id: steps-1
    notes:
      - 'Just cream, milk, sugar, yolks, and vanilla.'
      - '170g sugar makes a sweet, scoop-shop-style ice cream that scoops softly.'
      - '32g of yolk (about two large) adds just enough richness while keeping the color pale and the vanilla front and center.'
      - 'Cream plus skim milk gives a high-fat, low-water base for a dense, smooth scoop.'
    tips:
      - 'Pulling the base at 168°F sets the proteins gently for a silky, clean-tasting custard.'
