slug: french-crullers
title: French Crullers
order: 12
description: 'French crullers are a culinary masterpiece - prized for their delicate, tender, airy centers. They are prepared by deep frying a classic French pâte à choux. This dough relies on steam for lift rather than traditional leavening agents. When prepared properly, pâte à choux creates a delicate pastry that puffs beautifully. This dough is versatile, forming the base of many French pastries like éclairs and cream puffs. For crullers, the dough is piped into rings, then fried to perfection.'
