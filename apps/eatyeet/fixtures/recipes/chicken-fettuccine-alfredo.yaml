created: '2026-08-22'
blocks:
  - type: recipe
    equipment: []
    ingredients:
      - title: Chicken
        items:
          - '3 boneless, skinless chicken breasts (about 1½ lb)'
          - ¼ cup canola oil
          - 3 tbsp lemon juice (about 1 lemon)
          - '4 cloves garlic, minced'
          - 1½ tsp kosher salt
          - ½ tsp freshly ground black pepper
          - '1 tbsp canola oil, for the pan'
          - 1 tbsp unsalted butter
      - title: Sauce
        items:
          - 6 tbsp unsalted butter
          - '2 small shallots, very finely minced'
          - ¾ cup heavy cream
          - 1½ cups finely grated Parmigiano Reggiano
          - ½ tsp kosher salt
          - Several grinds of black pepper
      - title: Pasta
        items:
          - 16 oz (500g) dried fettuccine
          - 'Kosher salt, for the pasta water'
      - title: To Serve
        items:
          - Coarsely chopped fresh parsley (optional)
          - Extra Parmigiano Reggiano
    steps:
      - title: Marinade
        items:
          - 'Whisk the ¼ cup canola oil, lemon juice, garlic, salt, and pepper together in a bowl or zip-top bag. Add the chicken and turn to coat.'
          - Refrigerate 3–24 hours. Pull it out about 30 min before cooking so it is not going into the pan straight from the fridge.
      - title: Chicken
        items:
          - 'Scrape the marinade off the chicken and pat it dry. Clinging garlic scorches over a 10-minute sear, and wet chicken steams instead of browning.'
          - 'Heat the 1 tbsp canola oil in a large straight-sided skillet over medium-high until it shimmers, 2–3 min. Skip the nonstick — the browned bits left behind are the base of the sauce.'
          - 'Swirl the pan to coat, add the chicken, and leave it alone until the underside is golden and releases on its own, 5–7 min. If it sticks when you go to turn it, it isn''t ready.'
          - 'Flip, drop the butter in between the pieces, and swirl the pan to spread it as it melts. Cook to 165°F internal, another 5–7 min.'
          - 'Rest on a board for 3 min, then cut into ½-inch slices and tent with foil.'
      - title: Pasta
        items:
          - 'Boil the fettuccine in well-salted water and pull it 1 minute short of the package''s al dente. Reserve ½ cup of the pasta water plus a mug more, then drain.'
      - title: Sauce
        items:
          - 'In the same skillet over medium heat, melt the butter and scrape up the fond. Add the shallots and cook until tender, about 2 min.'
          - 'Pour in the cream, bring to a boil, then drop to medium-low and simmer 3 min.'
          - 'Off the heat, stir in the Parmigiano, salt, and pepper until smooth. Keeping it off direct heat is what stops the cheese from breaking.'
      - title: Finish
        items:
          - 'Return the pan to medium-high. Add the drained pasta and the ½ cup reserved water and toss gently for about 1 min — the starch pulls butter, cream, and cheese into a glossy coat that clings to each strand instead of pooling.'
          - 'Off the heat immediately. Plate, top with the sliced chicken, and finish with parsley, extra Parmigiano, and more pepper.'
    notes:
      - 'The toss at the end is the whole recipe. Starchy pasta water plus heat is what turns butter, cream, and cheese into a sauce instead of a puddle.'
    tips:
      - Grate the Parmigiano finely yourself. Pre-shredded cheese carries anti-caking starch that turns the sauce grainy.
      - Have everything cut and grated before the chicken goes in — from that point on the whole dish moves in one continuous stretch.
