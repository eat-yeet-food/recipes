slug: chicken-fettuccine-alfredo
title: Fettuccine Alfredo
order: 7
description: >-
  Fettuccine tossed in a Parmigiano cream sauce emulsified with starchy pasta water, with grilled chicken if you want
  it.
category: savory
prepMinutes: 15
cookMinutes: 25
totalMinutes: 220
yieldAmount: 6
yieldUnit: servings
