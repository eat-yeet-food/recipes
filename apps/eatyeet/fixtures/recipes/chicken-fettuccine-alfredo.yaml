slug: chicken-fettuccine-alfredo
title: Chicken Fettuccine Alfredo
description: 'Fettuccine tossed in a Parmigiano cream sauce emulsified with starchy pasta water, topped with chicken seared in the same pan.'
category: savory
prepMinutes: 15
cookMinutes: 25
totalMinutes: 220
yieldAmount: 6
yieldUnit: servings
