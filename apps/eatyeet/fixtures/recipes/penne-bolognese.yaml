blocks:
  - type: recipe
    equipment: []
    ingredients:
      - title: ''
        items:
          - id: ingredients-1-item-1
            text: '2 tbsp [extra virgin olive oil](https://www.amazon.com/Graza-Sizzle-Extra-Virgin-Olive/dp/B09WV8DBPV)'
          - id: ingredients-1-item-2
            text: >-
              4 oz diced
              [pancetta](https://www.wholefoodsmarket.com/product/wellshire-farms-colamecos-uncured-diced-pork-pancetta-b074vblh32)
          - id: ingredients-1-item-3
            text: 200g small dice sweet onion (~1 large onion)
          - id: ingredients-1-item-4
            text: 180g small dice carrot (~2 large carrots)
          - id: ingredients-1-item-5
            text: 160g small dice celery (~2 large stalks)
          - id: ingredients-1-item-6
            text: 4 cloves minced garlic
          - id: ingredients-1-item-7
            text: 1 cup of Pinot Grigio or Sauvignon Blanc
          - id: ingredients-1-item-8
            text: >-
              3 oz [Mutti double concentrated tomato
              paste](https://www.amazon.com/Mutti-Concentrated-Concentrato-Additives-Preservatives/dp/B0074RC0GY)
          - id: ingredients-1-item-9
            text: '½ tbsp [Diamond kosher salt](https://www.amazon.com/Diamond-Crystal-Kosher-Salt-lbs/dp/B0011BPMUK)'
          - id: ingredients-1-item-10
            text: 1 cup of whole milk
          - id: ingredients-1-item-11
            text: 2.25 lb 80/20 ground beef mince
          - id: ingredients-1-item-12
            text: 1 28 oz can of Bianco di Napoli whole peeled tomatoes
          - id: ingredients-1-item-13
            text: 4 oz water
          - id: ingredients-1-item-14
            text: '16 oz dried pasta of choice, such as rigatoni, tagliatelle, pappardelle, or penne'
          - id: ingredients-1-item-15
            text: >-
              16 oz finely grated [Parmigiano
              Reggiano](https://www.wholefoodsmarket.com/product/mitica-parmigiano-reggiano-24-month-raw-b07fz74rrn)
        id: ingredients-1
    steps:
      - title: ''
        items:
          - id: steps-1-item-1
            text: 'Dice onion, carrot, and celery and place in a bowl to make the soffritto.'
          - id: steps-1-item-2
            text: Mince garlic and set aside in a small ramekin.
          - id: steps-1-item-3
            text: >-
              Open tomatoes and pour into a medium bowl, mashing thoroughly with a [tomato
              masher](https://www.amazon.com/Stainless-Professional-Integrated-Potatoes-Dishwasher/dp/B09SYC49D4) and
              set aside.
          - id: steps-1-item-4
            text: Heat oil and pancetta in a dutch oven on medium high heat until well browned.
          - id: steps-1-item-5
            text: >-
              Place the soffritto in the dutch oven, heating and stirring with a wooden spoon for about 7 minutes. Add
              garlic in the last minute.
          - id: steps-1-item-6
            text: >-
              Deglaze the pan with 1 cup of white wine and stir with a wooden spoon until almost no liquid remains and
              the smell of alcohol is gone, about 7-10 minutes.
          - id: steps-1-item-7
            text: >-
              Push soffritto and pancetta to the side of the dutch oven and add tomato paste to the empty region. Allow
              the tomato paste to mingle with a little of the remaining liquid, stir, and simmer for 2 minutes and add
              the salt.
          - id: steps-1-item-8
            text: Pour in milk and add ground beef mince.
          - id: steps-1-item-9
            text: >-
              Quickly stir ground beef mince and integrate thoroughly with the other ingredients, stirring until the
              mixture begins to slowly bubble.
          - id: steps-1-item-10
            text: >-
              Add mashed tomatoes to the mixture, rinsing the can with 4 oz of water and adding to the mixture. Stir
              until the mixture starts to bubble and reduce heat to the lightest simmer setting.
          - id: steps-1-item-11
            text: >-
              Allow to simmer uncovered for 3.5-4 hours until all water has evaporated, stirring every 20-30 minutes.
              The only remaining liquid should be fat.
          - id: steps-1-item-12
            text: >-
              If the mixture becomes prematurely dehydrated, add 4 ounces of water. Be sure to allow all excess water to
              evaporate before serving.
          - id: steps-1-item-13
            text: >-
              Boil pasta in heavily salted water according to its package timing until al dente. Strain pasta. Reserve 1
              cup of pasta water.
          - id: steps-1-item-14
            text: >-
              Add 1 cup of pasta water back to the large pot that you used to boil the pasta in and reduce on high heat
              to ¼ cup. Once reduced add the pasta and bolognese and cook on high for one minute.
          - id: steps-1-item-15
            text: Serve 4 portions and top each with 1/4 of the grated Parmigiano Reggiano.
        id: steps-1
    notes:
      - >-
        The most important factor in this recipe is using high quality tomatoes and tomato paste. The brands called for
        here lend a good amount of sweetness without making the sauce overly acidic.
      - 'Many recipes suggest a mix of beef, pork, and veal for mince. I prefer the taste of just beef.'
      - >-
        Garlic is a non-standard bolognese addition. I have made it with and without and think it's a little better with
        it. This can be omitted.
    tips: []
