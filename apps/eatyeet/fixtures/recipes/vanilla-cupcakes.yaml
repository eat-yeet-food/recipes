slug: vanilla-cupcakes
title: Vanilla Cupcakes
order: 10
description: 'Tender, evenly-domed vanilla cupcakes from a reverse-creamed batter. Sour cream, milk powder, and a touch of oil give a rich crumb that''s still bakery-light.'
category: sweet
prepMinutes: 22
cookMinutes: 20
totalMinutes: 72
yieldAmount: 12
yieldUnit: cupcakes
