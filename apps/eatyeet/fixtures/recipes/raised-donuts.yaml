        id: equipment-1
    ingredients:
      - title: ''
        items:
          - id: ingredients-1-item-1
            text: >-
              1000g [unbleached all purpose
              flour](https://www.wholefoodsmarket.com/product/365-by-whole-foods-market-flour-allpurpose-5-lb-b074jd6hhh)
          - id: ingredients-1-item-2
            text: '100g [caster sugar](https://a.co/d/4OpKei5)'
          - id: ingredients-1-item-3
            text: >-
              28g [baker's dry milk powder](https://shop.kingarthurbaking.com/items/bakers-special-dry-milk) (high heat
              treated)
          - id: ingredients-1-item-4
            text: 10g fine sea salt
          - id: ingredients-1-item-5
            text: '14g [SAF gold instant yeast](https://a.co/d/j9mxG9d)'
          - id: ingredients-1-item-6
            text: 280g ice cold water
          - id: ingredients-1-item-7
            text: '300g eggs, refrigerated (6 eggs)'
          - id: ingredients-1-item-8
            text: '195g unsalted Kerrygold butter, cold'
          - id: ingredients-1-item-9
            text: >-
              48-64 oz of [crisco shortening](https://www.walmart.com/ip/Crisco-All-Vegetable-Shortening-48-oz) (for
              fryer, 2 inch depth in pot)
        id: ingredients-1
    steps:
      - title: ''
        items:
          - id: steps-1-item-1
            text: >-
              Place cold butter between two pieces of parchment paper and roll out with a rolling pin until pliable.
              Should still be cold and should peel from parchment. If it doesn't peel cleanly, put it in the
              refrigerator for 5m.
          - id: steps-1-item-2
            text: >-
              Combine and mix all ingredients except butter in the bowl of a spiral mixer. Mix for about 4 minutes until
              combined. Dough should be about 69°F. Use a bench scraper a couple times throughout to scrape down the
              sides of the mixer. Cover and allow to rest for 20 minutes to further develop gluten.
          - id: steps-1-item-3
            text: >-
              Place a medium saucepan with a small amount of boiling water and place in the oven with the heat off. Try
              to maintain temperature between 90-100°F and humidity 80-85% using a hygrometer in the oven. Maintaining
              proper temperature and humidity is important. I take the water out and reheat if it falls below this level
              and remove water if humidity goes above this level.
          - id: steps-1-item-4
            text: >-
              After 20 minute rest, start the mixer on medium high speed and let it run for a few minutes to develop
              gluten, until it reaches 73°F. Mix in butter over a 5 minute period in 40g strips until fully integrated.
              Mix for a few more minutes, stopping when dough reaches 78°F and passes the windowpane test. Remove dough
              from the mixer and tighten up into a ball with a bench scraper.
          - id: steps-1-item-5
            text: >-
              Transfer the dough to a greased bowl, cover to rise in the proofer until it doubles in size, roughly 75
              minutes. Remove from the proofer and allow to sit covered at room temperature for 15 more minutes.
          - id: steps-1-item-6
            text: >-
              Remove the dough and turn it out onto a lightly floured surface. Gently roll it out to 50 cm x 35 cm, to
              ½" thickness. Be very gentle rolling out, do not apply too much pressure to get to this thickness. Allow
              to rest for 1 minute before cutting. Cut out doughnuts with a 3.5" cutter in a 4 x 3 grid. Place doughnuts
              on greased pre-cut 4x4" parchment paper in a proofing tray uncovered. Place in an oven with the medium
              saucepan filled with boiling water for 45 minutes. Remove donuts for 5 minutes to dry a bit before putting
              in the fryer.
          - id: steps-1-item-7
            text: >-
              Fill fryer with 2 quarts of oil. Heat oil to 350°F. Remove the donut gently from the parchment by placing
              face down in one hand and peeling off the paper. It should be removed easily due to application of oil
              earlier. Place donuts three at a time in the oil, presentation side up. Cook for 60 seconds on each side.
              Remove with a spider strainer, place on paper towels for a moment, and transfer to a wire rack in your
              proofing tray.
          - id: steps-1-item-8
            text: >-
              Allow donuts to cool for 5 minutes then dip in
              [glaze](https://docs.google.com/document/d/1Wc0D_TJL1q1Lxyk2G4kLw_9TTtKXmumwiDc_Uq7OGxQ/edit#heading=h.h6w37mu9xtq5)
              shaking excess before returning to a rack to cool.
        id: steps-1
    notes: []
    tips:
      - >-
        Rolling out doughnuts too thin or with too much force will inhibit rise in the fryer. I gently roll to ½",
        roughly the length of the tip of my index finger to the first joint behind my fingernail.
      - >-
        Be gentle when placing dough on the parchment paper for final proof, try to maintain a perfect circular shape
        without distortion. The shape that you place on the paper will determine its final shape out of the fryer. Any
        distortion will be amplified as the dough proofs.
      - >-
        Be careful to not overproof the donuts. With a light poke the dough should bounce back just a bit and not
        deflate.
      - Fry donuts with presentation side up to start to maintain best shape.
      - >-
        Wait 1-5 minutes before dipping in the glaze so that the donut retains a good amount of glaze and that the
        majority does not drip off.
