openapi: 3.1.0
info:
  title: Eat / Yeet app API
  version: 1.0.0
  description: >
    Fully resolved, read-only view models for the iOS app. Mirrors src/types.ts.
    Add fields freely; renames, removals and meaning changes need /v2.
servers:
  - url: https://eatyeet.com/api/public/app/v1
  - url: http://127.0.0.1:3000/api/public/app/v1
paths:
  /home:
    get:
      operationId: getHome
      responses:
        '200':
          description: The home page (hero, What's New, featured categories) and the phone menu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Home' }
  /remix:
    get:
      operationId: listRemixRecipes
      responses:
        '200':
          description: Recipes Remix can start from.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemixIndex' }
  /remix/{slug}:
    get:
      operationId: getRemixRecipe
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The recipe's calculator state as written and its choices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemixRecipe' }
        '404':
          description: No remixable recipe with this slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /remix/{slug}/resolve:
    post:
      operationId: resolveRemix
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties: { state: { type: object, additionalProperties: true } }
      responses:
        '200':
          description: Validation, facts, totals, changes and the projected recipe for this state. Computes only; stores nothing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemixResolution' }
        '400':
          description: Malformed or oversized request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No remixable recipe with this slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /recipes:
    get:
      operationId: listRecipes
      responses:
        '200':
          description: Published recipes in display order, with their images.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeIndex' }
  /recipes/{slug}:
    get:
      operationId: getRecipe
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - name: count
          in: query
          required: false
          description: Today's batch count, clamped to 1–99. Ignored for recipes without a calculator.
          schema: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '200':
          description: The recipe as written, projected for today's count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeDetail' }
        '404':
          description: Not found or not published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
    ImageVariant:
      type: object
      required: [url, width, format]
      properties:
        url: { type: string }
        width: { type: integer }
        format: { type: string }
    Image:
      type: object
      required: [url, width, height, alt, variants]
      properties:
        url: { type: string }
        width: { type: integer }
        height: { type: integer }
        alt: { type: string }
        focalPoint: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        variants: { type: array, items: { $ref: '#/components/schemas/ImageVariant' } }
    RecipeSummary:
      type: object
      required: [slug, title, description, category, image, totalLabel, prepLabel, cookLabel, timeLabel, yieldLabel, courses, methods, cuisines, restrictions, searchText, order]
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        image: { type: string }
        totalLabel: { type: string }
        prepLabel: { type: string }
        cookLabel: { type: string }
        timeLabel: { type: string }
        yieldLabel: { type: string }
        courses: { type: array, items: { type: string } }
        methods: { type: array, items: { type: string } }
        cuisines: { type: array, items: { type: string } }
        restrictions: { type: array, items: { type: string } }
        searchText: { type: string }
        order: { type: number }
    Heading:
      type: object
      required: [title, intro]
      properties:
        title: { type: string }
        intro: { type: string }
    Fact:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
    Home:
      type: object
      required: [wordmark, hero, latest, browse, navigation, images]
      properties:
        wordmark:
          type: object
          required: [first, second]
          properties: { first: { type: string }, second: { type: string } }
        hero:
          type: object
          required: [image, imageAlt, headline, sticker, kicker, motto, cta]
          properties:
            image: { type: string }
            imageAlt: { type: string }
            headline: { type: string, description: "Line breaks are significant." }
            sticker: { type: string, description: "The headline word set in the pink sticker; empty means the last word." }
            kicker: { type: string }
            motto: { type: string }
            cta: { type: string }
        latest:
          type: object
          required: [eyebrow, title, recipes]
          properties:
            eyebrow: { type: string }
            title: { type: string }
            recipes: { type: array, items: { $ref: '#/components/schemas/RecipeSummary' } }
        browse:
          type: object
          required: [eyebrow, title, categories]
          properties:
            eyebrow: { type: string }
            title: { type: string }
            categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
        navigation: { type: array, items: { $ref: '#/components/schemas/NavLink' } }
        images: { type: object, additionalProperties: { $ref: '#/components/schemas/Image' } }
    RemixIndex:
      type: object
      required: [recipes, images]
      properties:
        recipes:
          type: array
          items:
            type: object
            required: [slug, title, image, family, label, facts]
            properties:
              slug: { type: string }
              title: { type: string }
              image: { type: string }
              family: { type: string }
              label: { type: string }
              facts: { type: string }
        images: { type: object, additionalProperties: { $ref: '#/components/schemas/Image' } }
    RemixRecipe:
      type: object
      required: [slug, title, image, family, label, defaultState, methods, pizzaSizes, images]
      properties:
        slug: { type: string }
        title: { type: string }
        image: { type: string }
        family: { type: string, description: "The calculator: sourdough or pizza." }
        label: { type: string }
        defaultState: { type: object, additionalProperties: true, description: "The calculator's opaque state as written; the app edits known fields and keeps the rest." }
        methods: { type: array, items: { type: object, required: [id, label], properties: { id: { type: string }, label: { type: string } } } }
        pizzaSizes: { type: array, items: { type: object, required: [inches, ballGrams], properties: { inches: { type: number }, ballGrams: { type: number } } }, description: "Pizza sizes and the ball weight each takes; empty for bread." }
        images: { type: object, additionalProperties: { $ref: '#/components/schemas/Image' } }
    RemixChange:
      type: object
      required: [label, from, to]
      properties: { label: { type: string }, from: { type: string }, to: { type: string } }
    RemixResolution:
      type: object
      required: [valid, errors, facts, total, totalDetail, changes, batchNoun]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { type: string } }
        facts: { type: string }
        total: { type: string }
        totalDetail: { type: string }
        changes: { type: array, items: { $ref: '#/components/schemas/RemixChange' } }
        batchNoun: { type: string }
        recipe: { $ref: '#/components/schemas/Recipe', description: "The projected recipe; absent when the state is invalid." }
    Category:
      type: object
      required: [slug, label, facet, value, image]
      properties:
        slug: { type: string }
        label: { type: string }
        facet: { type: string }
        value: { type: string }
        image: { type: string }
    NavLink:
      type: object
      required: [label, href]
      properties: { label: { type: string }, href: { type: string } }
    RecipeIndex:
      type: object
      required: [heading, recipes, images]
      properties:
        heading: { $ref: '#/components/schemas/Heading' }
        recipes: { type: array, items: { $ref: '#/components/schemas/RecipeSummary' } }
        images: { type: object, additionalProperties: { $ref: '#/components/schemas/Image' } }
    Item:
      type: object
      required: [id, html]
      properties:
        id: { type: string }
        html: { type: string }
    Section:
      type: object
      required: [id, title, items]
      properties:
        id: { type: string }
        title: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/Item' } }
    Ingredient:
      type: object
      required: [id, html, amount]
      properties:
        id: { type: string }
        html: { type: string }
        amount: { type: string, description: "Leading amount, removed from html; empty when none." }
    IngredientSection:
      type: object
      required: [id, title, items]
      properties:
        id: { type: string }
        title: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/Ingredient' } }
    Need:
      type: object
      required: [key, amount, name]
      properties:
        key: { type: string }
        amount: { type: string }
        name: { type: string }
    Step:
      type: object
      required: [id, html, needs, time, minutes, rest, emphasis, timers]
      properties:
        id: { type: string }
        html: { type: string }
        needs: { type: array, items: { $ref: '#/components/schemas/Need' } }
        time: { type: [string, 'null'] }
        minutes: { type: [number, 'null'] }
        rest: { type: [string, 'null'] }
        emphasis: { type: boolean }
        timers:
          type: array
          description: "Durations written in the step (\"bake 13–15 minutes\"), as tap-to-start cook-mode timers set to the shorter end."
          items: { $ref: '#/components/schemas/StepTimer' }
    StepTimer:
      type: object
      required: [label, minutes]
      properties:
        label: { type: string }
        minutes: { type: number }
    StepSection:
      type: object
      required: [id, title, timeOrigin, timed, items]
      properties:
        id: { type: string }
        title: { type: string }
        timeOrigin: { type: [string, 'null'] }
        timed: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/Step' } }
    RecipeBlock:
      type: object
      required: [ingredients, equipment, steps, notes, tips]
      properties:
        ingredients: { type: array, items: { $ref: '#/components/schemas/IngredientSection' } }
        equipment: { type: array, items: { $ref: '#/components/schemas/Section' } }
        steps: { type: array, items: { $ref: '#/components/schemas/StepSection' } }
        notes: { type: array, items: { type: string } }
        tips: { type: array, items: { type: string } }
    Recipe:
      type: object
      required: [slug, title, description, category, image, totalLabel, prepLabel, cookLabel, timeLabel, yieldLabel, courses, methods, cuisines, restrictions, searchText, order, facts, blocks]
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        image: { type: string }
        totalLabel: { type: string }
        prepLabel: { type: string }
        cookLabel: { type: string }
        timeLabel: { type: string }
        yieldLabel: { type: string }
        courses: { type: array, items: { type: string } }
        methods: { type: array, items: { type: string } }
        cuisines: { type: array, items: { type: string } }
        restrictions: { type: array, items: { type: string } }
        searchText: { type: string }
        order: { type: number }
        facts: { type: array, items: { $ref: '#/components/schemas/Fact' } }
        blocks: { type: array, items: { $ref: '#/components/schemas/RecipeBlock' } }
    Batch:
      type: object
      required: [count, noun, plural]
      properties:
        count: { type: integer }
        noun: { type: string }
        plural: { type: string }
    RecipeDetail:
      type: object
      required: [recipe, images]
      properties:
        recipe: { $ref: '#/components/schemas/Recipe' }
        batch:
          $ref: '#/components/schemas/Batch'
          description: Today's count; omitted for recipes without a calculator.
        images: { type: object, additionalProperties: { $ref: '#/components/schemas/Image' } }
